<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mailbox - Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <style>
    body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#f8f9fa,#eef1f5)}
    .login-card{width:min(420px,92vw);border:0;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.12)}
    .brand{font-size:1.35rem;font-weight:700}
  </style>
</head>
<body>
<div class="card login-card">
  <div class="card-body p-4">
    <div class="text-center mb-4">
      <i class="bi bi-envelope-paper fs-1"></i>
      <div class="brand mt-2">Mailbox</div>
      <div class="text-secondary small">Sign in to your mailbox</div>
    </div>
    <div id="alert" class="alert d-none"></div>
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Email address</label>
        <input id="email" type="email" class="form-control" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input id="password" type="password" class="form-control" autocomplete="current-password" required>
      </div>
      <button id="loginBtn" class="btn btn-primary w-100" type="submit">
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign in
      </button>
    </form>
  </div>
<div style="text-align:center"> <a href="new-user-register.html" target="_balnk">New User Register</a> * * * <span><a href="user-password-reset.html" target="_balnk">Forgot Password</a> </span></div>
</div>
<script>
window.MAILBOX_API_URL='https://script.google.com/macros/s/AKfycby-YQZngcKrKxSKwHoZ_e7fIyOfUvuF66x3dWJRod84DN8L9FiTQYvaajxtOZg0yh7z/exec';
</script>
<script src="mailbox-api.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const alertBox=document.getElementById('alert'), btn=document.getElementById('loginBtn');
  alertBox.className='alert d-none';
  btn.disabled=true; btn.innerHTML='<span class="spinner-border spinner-border-sm me-1"></span> Signing in...';
  try {
    const r=await MailboxAPI.login(document.getElementById('email').value,document.getElementById('password').value);
    MailboxAPI.setSession(r);
    location.href='mailbox.html';
  } catch(err) {
    alertBox.textContent=err.message;
    alertBox.className='alert alert-danger';
  } finally {
    btn.disabled=false; btn.innerHTML='<i class="bi bi-box-arrow-in-right me-1"></i> Sign in';
  }
});
</script>
</body>
</html>
