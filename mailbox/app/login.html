<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="theme-color" content="#f4f7fb" id="themeColorMeta">

<title>Mailbox - Sign In</title>

<!-- Bootstrap Icons only; login CSS is self-contained for faster startup. -->

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

<!-- Start fetching the next page while the user is typing. -->

<link rel="prefetch" href="mailbox.html">

<style>
:root{
  --primary:#0d6efd;
  --primary-dark:#0957c7;

  --text:#172033;
  --muted:#6b7485;
  --label:#394357;

  --border:#e5eaf1;

  --surface:rgba(255,255,255,.88);
  --input-bg:rgba(255,255,255,.86);
  --input-focus-bg:#fff;

  --page-top:#f8fafc;
  --page-bottom:#eef3f8;

  --card-border:rgba(255,255,255,.9);

  --top-fade-start:rgba(255,255,255,.9);
  --top-fade-end:rgba(255,255,255,0);

  --password-hover:#f1f4f8;
  --password-color:#7c8798;

  --link:#1769d1;

  --shadow:
    0 24px 70px rgba(23,32,51,.14),
    0 4px 18px rgba(23,32,51,.06);

  --alert-error-text:#9b1c1c;
  --alert-error-bg:#fff0f0;
  --alert-error-border:#ffd2d2;

  --alert-success-text:#17663b;
  --alert-success-bg:#edf9f2;
  --alert-success-border:#ccefd9;

  color-scheme:light;
}


/* =========================================================
   AUTOMATIC DARK THEME
   Follows Windows / browser system theme.
   ========================================================= */

@media (prefers-color-scheme:dark){

  :root{
    --text:#edf2f7;
    --muted:#a8b1c0;
    --label:#cbd3df;

    --border:#394353;

    --surface:rgba(28,34,45,.88);
    --input-bg:rgba(22,28,38,.88);
    --input-focus-bg:#1c2430;

    --page-top:#111722;
    --page-bottom:#0b1018;

    --card-border:rgba(255,255,255,.08);

    --top-fade-start:rgba(255,255,255,.08);
    --top-fade-end:rgba(255,255,255,0);

    --password-hover:#2a3342;
    --password-color:#aeb8c7;

    --link:#6ea8fe;

    --shadow:
      0 24px 70px rgba(0,0,0,.45),
      0 4px 18px rgba(0,0,0,.28);

    --alert-error-text:#ffb4b4;
    --alert-error-bg:rgba(220,53,69,.13);
    --alert-error-border:rgba(255,100,115,.25);

    --alert-success-text:#8ee0b1;
    --alert-success-bg:rgba(25,135,84,.13);
    --alert-success-border:rgba(80,200,130,.25);

    color-scheme:dark;
  }
}


/* =========================================================
   BASE
   ========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  min-height:100%;
  margin:0;
}

body{
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:24px;

  color:var(--text);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(13,110,253,.09),
      transparent 34%
    ),
    radial-gradient(
      circle at 90% 85%,
      rgba(25,135,84,.07),
      transparent 32%
    ),
    linear-gradient(
      180deg,
      var(--page-top) 0%,
      var(--page-bottom) 100%
    );

  transition:
    background .25s ease,
    color .25s ease;
}


/* =========================================================
   LOGIN SHELL
   ========================================================= */

.login-shell{
  width:min(430px,100%);
}


/* =========================================================
   LOGIN CARD
   ========================================================= */

.login-card{
  position:relative;
  overflow:hidden;

  border:1px solid var(--card-border);
  border-radius:28px;

  background:var(--surface);

  box-shadow:var(--shadow);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  transition:
    background .25s ease,
    border-color .25s ease,
    box-shadow .25s ease;
}

.login-card::before{
  content:"";

  position:absolute;
  left:0;
  right:0;
  top:0;

  height:110px;

  background:
    linear-gradient(
      180deg,
      var(--top-fade-start),
      var(--top-fade-end)
    );

  pointer-events:none;
}


/* =========================================================
   CONTENT
   ========================================================= */

.login-content{
  position:relative;
  padding:34px 34px 30px;
}


/* =========================================================
   BRAND
   ========================================================= */

.brand{
  text-align:center;
  margin-bottom:28px;
}

.brand-icon{
  width:66px;
  height:66px;

  margin:0 auto 15px;

  display:grid;
  place-items:center;

  border-radius:20px;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #0d6efd,
      #3d8bfd
    );

  box-shadow:
    0 12px 28px rgba(13,110,253,.25);

  font-size:30px;
}

.brand-name{
  font-size:1.38rem;
  font-weight:750;
  letter-spacing:-.02em;
}

.brand-subtitle{
  margin-top:5px;

  color:var(--muted);

  font-size:.88rem;
}


/* =========================================================
   FORM FIELDS
   ========================================================= */

.field{
  margin-bottom:17px;
}

.field-label{
  display:block;

  margin:0 0 7px 2px;

  font-size:.82rem;
  font-weight:650;

  color:var(--label);
}

.input-wrap{
  position:relative;
}

.input-icon{
  position:absolute;

  left:14px;
  top:50%;

  transform:translateY(-50%);

  color:#8791a2;

  pointer-events:none;
}

.form-control{
  width:100%;
  height:48px;

  border:1px solid var(--border);
  border-radius:14px;

  outline:0;

  padding:0 44px;

  color:var(--text);
  background:var(--input-bg);

  font:inherit;
  font-size:.93rem;

  transition:
    border-color .16s,
    box-shadow .16s,
    background .16s,
    color .16s;
}

.form-control::placeholder{
  color:var(--muted);
  opacity:.82;
}

.form-control:focus{
  border-color:rgba(13,110,253,.58);

  background:var(--input-focus-bg);

  box-shadow:
    0 0 0 4px rgba(13,110,253,.10);
}


/* =========================================================
   PASSWORD TOGGLE
   ========================================================= */

.password-toggle{
  position:absolute;

  right:8px;
  top:50%;

  width:34px;
  height:34px;

  transform:translateY(-50%);

  border:0;
  border-radius:10px;

  background:transparent;

  color:var(--password-color);

  cursor:pointer;
}

.password-toggle:hover:not(:disabled){
  background:var(--password-hover);
  color:var(--text);
}

.password-toggle:disabled{
  cursor:wait;
  opacity:.6;
}


/* =========================================================
   LOGIN BUTTON
   ========================================================= */

.login-button{
  width:100%;
  height:48px;

  margin-top:7px;

  border:0;
  border-radius:14px;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #0d6efd,
      #1769d1
    );

  box-shadow:
    0 9px 22px rgba(13,110,253,.22);

  font:inherit;
  font-weight:700;

  cursor:pointer;

  transition:
    transform .15s,
    box-shadow .15s,
    opacity .15s;
}

.login-button:hover:not(:disabled){
  transform:translateY(-1px);

  box-shadow:
    0 12px 27px rgba(13,110,253,.27);
}

.login-button:disabled{
  opacity:.72;
  cursor:wait;
}

.btn-content{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  gap:9px;
}


/* =========================================================
   LOADING SPINNER
   ========================================================= */

.spinner{
  width:17px;
  height:17px;

  border:2px solid rgba(255,255,255,.4);

  border-top-color:#fff;

  border-radius:50%;

  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}


/* =========================================================
   ALERT
   ========================================================= */

.alert{
  display:none;

  margin:0 0 17px;

  padding:11px 13px;

  border-radius:13px;

  font-size:.84rem;
  line-height:1.4;
}

.alert.show{
  display:flex;

  gap:9px;
  align-items:flex-start;
}

.alert.error{
  color:var(--alert-error-text);

  background:var(--alert-error-bg);

  border:1px solid var(--alert-error-border);
}

.alert.success{
  color:var(--alert-success-text);

  background:var(--alert-success-bg);

  border:1px solid var(--alert-success-border);
}


/* =========================================================
   ACCOUNT LINKS
   ========================================================= */

.links{
  display:flex;

  justify-content:center;
  align-items:center;

  gap:11px;

  margin-top:22px;

  font-size:.8rem;
}

.links a{
  color:var(--link);

  text-decoration:none;

  font-weight:600;
}

.links a:hover{
  text-decoration:underline;
}

.dot{
  color:#a2a9b5;
}


/* =========================================================
   FOOTER
   ========================================================= */

.footer-note{
  text-align:center;

  margin-top:16px;

  color:var(--muted);

  font-size:.72rem;
}


/* =========================================================
   PAGE LEAVE ANIMATION
   ========================================================= */

.page-leaving .login-card{
  animation:leave .18s ease forwards;
}

@keyframes leave{
  to{
    opacity:0;
    transform:
      translateY(-5px)
      scale(.985);
  }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:480px){

  body{
    padding:14px;
  }

  .login-content{
    padding:28px 22px 24px;
  }

  .login-card{
    border-radius:23px;
  }
}
</style>

</head>

<body>

<main class="login-shell">

  <section
    class="login-card"
    aria-labelledby="login-title">


<div class="login-content">

  <!-- BRAND -->
  <header class="brand">

    <div
      class="brand-icon"
      aria-hidden="true">

      <i class="bi bi-envelope-paper"></i>

    </div>

    <div
      id="login-title"
      class="brand-name">

      Mailbox

    </div>

    <div class="brand-subtitle">

      Your internal mailbox

    </div>

  </header>


  <!-- ALERT -->
  <div
    id="alert"
    class="alert"
    role="alert"
    aria-live="polite">
  </div>


  <!-- LOGIN FORM -->
  <form
    id="loginForm"
    novalidate>

    <!-- EMAIL -->
    <div class="field">

      <label
        class="field-label"
        for="email">

        Email address

      </label>

      <div class="input-wrap">

        <i
          class="bi bi-person input-icon"
          aria-hidden="true">
        </i>

        <input
          id="email"
          class="form-control"
          type="email"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
          placeholder="Enter your email address"
          required>

      </div>

    </div>


    <!-- PASSWORD -->
    <div class="field">

      <label
        class="field-label"
        for="password">

        Password

      </label>

      <div class="input-wrap">

        <i
          class="bi bi-lock input-icon"
          aria-hidden="true">
        </i>

        <input
          id="password"
          class="form-control"
          type="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          required>

        <button
          id="passwordToggle"
          class="password-toggle"
          type="button"
          aria-label="Show password"
          title="Show password">

          <i class="bi bi-eye"></i>

        </button>

      </div>

    </div>


    <!-- LOGIN -->
    <button
      id="loginBtn"
      class="login-button"
      type="submit">

      <span
        id="loginButtonContent"
        class="btn-content">

        <i class="bi bi-box-arrow-in-right"></i>

        <span>Sign in</span>

      </span>

    </button>

  </form>


  <!-- ACCOUNT LINKS -->
  <nav
    class="links"
    aria-label="Account links">

    <a
      href="new-user-register.html"
      target="_blank"
      rel="noopener">

      <i class="bi bi-person-plus me-1"></i>

      New User Register

    </a>

    <span class="dot">•</span>

    <a
      href="user-password-reset.html"
      target="_blank"
      rel="noopener">

      <i class="bi bi-key me-1"></i>

      Forgot Password

    </a>

  </nav>


  <!-- FOOTER -->
  <div class="footer-note">

    Mailbox
    &nbsp; • &nbsp;
    Secure internal service

  </div>

</div>


  </section>

</main>

<script>
'use strict';


/* =========================================================
   SAME API URL AS CURRENT MAILBOX.HTML
   ========================================================= */

const MAILBOX_API_URL =
  'https://script.google.com/macros/s/AKfycbztFYkp6V7YglnFLtZ7GbEXzoctYiBilV4lA4VgLm3WFKF8lYENWdM90_zy0uC1gmdG/exec';


const SESSION_TOKEN_KEY = 'mailbox_token';
const SESSION_USER_KEY = 'mailbox_user';


/* =========================================================
   ELEMENTS
   ========================================================= */

const form =
  document.getElementById('loginForm');

const emailInput =
  document.getElementById('email');

const passwordInput =
  document.getElementById('password');

const loginBtn =
  document.getElementById('loginBtn');

const loginButtonContent =
  document.getElementById('loginButtonContent');

const alertBox =
  document.getElementById('alert');

const passwordToggle =
  document.getElementById('passwordToggle');

const themeColorMeta =
  document.getElementById('themeColorMeta');


/* =========================================================
   AUTOMATIC THEME COLOR
   Keeps browser/mobile address bar synchronized with
   the current device theme.
   ========================================================= */

const darkModeQuery =
  window.matchMedia('(prefers-color-scheme: dark)');


function updateThemeColor(){

  if(darkModeQuery.matches){

    themeColorMeta.setAttribute(
      'content',
      '#111722'
    );

  }else{

    themeColorMeta.setAttribute(
      'content',
      '#f4f7fb'
    );

  }
}


/* Apply immediately. */
updateThemeColor();


/*
 * If the user changes Windows/browser theme while the
 * login page is open, update the browser theme color too.
 *
 * The CSS itself automatically updates because it uses
 * prefers-color-scheme.
 */
if(darkModeQuery.addEventListener){

  darkModeQuery.addEventListener(
    'change',
    updateThemeColor
  );

}else if(darkModeQuery.addListener){

  /* Compatibility with older browsers. */
  darkModeQuery.addListener(
    updateThemeColor
  );

}


/* =========================================================
   ALERT
   ========================================================= */

function showAlert(
  message,
  type='error'
){

  alertBox.className =
    'alert show ' + type;

  alertBox.innerHTML =
    '<i class="bi ' +
    (
      type === 'success'
        ? 'bi-check-circle'
        : 'bi-exclamation-circle'
    ) +
    '"></i><span></span>';

  alertBox
    .querySelector('span')
    .textContent = message;
}


function clearAlert(){

  alertBox.className = 'alert';

  alertBox.textContent = '';

}


/* =========================================================
   BUSY STATE
   ========================================================= */

function setBusy(busy){

  loginBtn.disabled = busy;

  emailInput.disabled = busy;

  passwordInput.disabled = busy;

  passwordToggle.disabled = busy;


  loginButtonContent.innerHTML = busy

    ? '<span class="spinner"></span>' +
      '<span>Signing in...</span>'

    : '<i class="bi bi-box-arrow-in-right"></i>' +
      '<span>Sign in</span>';
}


/* =========================================================
   SAVE SESSION
   ========================================================= */

function saveSession(data){

  sessionStorage.setItem(
    SESSION_TOKEN_KEY,
    data.token
  );

  sessionStorage.setItem(
    SESSION_USER_KEY,
    JSON.stringify(data.user || null)
  );

}


/* =========================================================
   LOGIN API
   ========================================================= */

async function login(
  email,
  password
){

  const response =
    await fetch(
      MAILBOX_API_URL,
      {
        method:'POST',

        headers:{
          'Content-Type':
            'text/plain;charset=utf-8'
        },

        body:JSON.stringify({
          action:'login',
          email,
          password
        }),

        redirect:'follow'
      }
    );


  if(!response.ok){

    throw new Error(
      'Server error: ' +
      response.status
    );

  }


  const data =
    await response.json();


  if(!data || data.ok === false){

    throw new Error(
      data?.error ||
      data?.message ||
      'Invalid login credentials.'
    );

  }


  if(!data.token){

    throw new Error(
      'Login succeeded but no session token was returned.'
    );

  }


  return data;

}


/* =========================================================
   PASSWORD SHOW / HIDE
   ========================================================= */

passwordToggle.addEventListener(
  'click',
  () => {

    const visible =
      passwordInput.type === 'text';


    passwordInput.type =
      visible
        ? 'password'
        : 'text';


    passwordToggle.innerHTML =
      visible

        ? '<i class="bi bi-eye"></i>'

        : '<i class="bi bi-eye-slash"></i>';


    passwordToggle.setAttribute(
      'aria-label',
      visible
        ? 'Show password'
        : 'Hide password'
    );


    passwordToggle.setAttribute(
      'title',
      visible
        ? 'Show password'
        : 'Hide password'
    );

  }
);


/* =========================================================
   LOGIN SUBMIT
   ========================================================= */

form.addEventListener(
  'submit',
  async event => {

    event.preventDefault();

    clearAlert();


    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;


    if(!email || !password){

      showAlert(
        'Please enter your email address and password.'
      );

      return;

    }


    setBusy(true);


    try{

      const result =
        await login(
          email,
          password
        );


      saveSession(result);


      /*
       * mailbox.html is already prefetched where supported,
       * so this navigation can use browser cache instead of
       * starting completely cold.
       */

      document.body.classList.add(
        'page-leaving'
      );


      window.location.replace(
        'mailbox.html'
      );


    }catch(error){

      showAlert(
        error?.message ||
        'Unable to sign in.'
      );

      setBusy(false);

    }

  }
);


/* =========================================================
   INITIAL FOCUS
   ========================================================= */

window.requestAnimationFrame(
  () => emailInput.focus()
);

</script>

</body>
</html>
