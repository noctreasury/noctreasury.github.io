<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>User management</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100vw;
      height: 100vh;
      border: 0;
    }
  </style>

</head>

<body>

  <iframe
    src="https://script.google.com/macros/s/AKfycbyLQQJugcfYIwyWsC6lmeOSi5iqNy6SnxRmoaO8s-LO-AuTXzo2N3wddAdTNnRGWuNw/exec"
    title="Google Apps Script Application"
    allow="clipboard-read; clipboard-write"
    allowfullscreen>
  </iframe>

</body>
</html>
