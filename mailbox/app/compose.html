  <script>
    (() => {
      'use strict';

      const root = document.documentElement;
      if (root.getAttribute('data-lte-color-mode') === 'off') return;

      const STORAGE_KEY = 'lte-theme';
      let stored = null;

      try {
        stored = localStorage.getItem(STORAGE_KEY);
      } catch (_) {}

      const authored = root.getAttribute('data-bs-theme');

      let resolved = 'light';

      if (stored === 'dark' || stored === 'light') {
        resolved = stored;
      } else if (authored === 'dark' || authored === 'light') {
        resolved = authored;
      } else if (
        globalThis.matchMedia &&
        globalThis.matchMedia('(prefers-color-scheme: dark)').matches
      ) {
        resolved = 'dark';
      }

      root.setAttribute('data-bs-theme', resolved);
      root.style.colorScheme = resolved;

      if (resolved !== authored) {
        root.setAttribute('data-lte-theme-resolved', '');
      }
    })();
  </script>

<script>
(() => {

  'use strict';

  MailboxAPI.requireLogin();


  /* =========================================================
     ELEMENTS
  ========================================================= */

  const to = document.getElementById('mail-to');
  const cc = document.getElementById('mail-cc');
  const bcc = document.getElementById('mail-bcc');
  const subject = document.getElementById('mail-subject');
  const body = document.getElementById('mail-body');
  const files = document.getElementById('mail-attach');

  const sendBtn = document.getElementById('send-button');
  const draftBtn = document.getElementById('draft-button');
  const discardBtn = document.getElementById('discard-button');

  const alertBox = document.getElementById('alert');

  const loadingBox =
    document.getElementById('compose-loading');

  const loadingText =
    document.getElementById('loading-text');

  const cardTitle =
    document.getElementById('card-title');

  const modeBadge =
    document.getElementById('mode-badge');

  const breadcrumbMode =
    document.getElementById('breadcrumb-mode');

  const forwardedPreview =
    document.getElementById('forwarded-preview');

  const originalAttachments =
    document.getElementById('original-attachments');

  const originalAttachmentList =
    document.getElementById('original-attachment-list');

  const attachmentStatus =
    document.getElementById('attachment-status');
/* =========================================================
   TO-FIELD EMAIL AUTOCOMPLETE
========================================================= */

const suggestionBox =
  document.getElementById('recipient-suggestions');

let suggestionItems = [];
let activeSuggestion = -1;
let suggestionTimer = null;
let suggestionRequestId = 0;


/* Get the current recipient being typed */

function currentRecipientFragment() {

  const value = to.value;

  const comma = value.lastIndexOf(',');

  return {
    prefix: value.slice(0, comma + 1),
    query: value.slice(comma + 1).trim()
  };

}


/* Hide dropdown */

function hideSuggestions() {

  suggestionBox.classList.remove('show');

  suggestionBox.innerHTML = '';

  to.setAttribute('aria-expanded', 'false');

  suggestionItems = [];

  activeSuggestion = -1;

}


/* Render matching users */

function renderSuggestions(items) {

  suggestionItems = Array.isArray(items) ? items : [];

  activeSuggestion = -1;

  if (!suggestionItems.length) {
    hideSuggestions();
    return;
  }

  suggestionBox.innerHTML = suggestionItems.map((item, index) => `

    <button
      type="button"
      class="recipient-suggestion"
      role="option"
      data-index="${index}"
      aria-selected="false"
    >

      <span class="fw-semibold">
        ${escapeHtml(item.name || item.email)}
      </span>

      <small>
        ${escapeHtml(item.email)}
        ${item.department
          ? ' · ' + escapeHtml(item.department)
          : ''}
      </small>

    </button>

  `).join('');

  suggestionBox.classList.add('show');

  to.setAttribute('aria-expanded', 'true');

}


/* Select an email */

function chooseSuggestion(index) {

  const item = suggestionItems[index];

  if (!item || !item.email) return;

  const fragment = currentRecipientFragment();

  to.value = fragment.prefix + item.email + ', ';

  hideSuggestions();

  to.focus();

}


/* Request suggestions from Apps Script */

async function lookupRecipientSuggestions(query) {

  const requestId = ++suggestionRequestId;

  try {

    const result =
      await MailboxAPI.suggestRecipients(query);

    if (requestId !== suggestionRequestId) return;

    renderSuggestions(result.suggestions || []);

  } catch (err) {

    console.warn(
      'Recipient suggestions unavailable:',
      err
    );

    hideSuggestions();

  }

}


/* Detect typing */

to.addEventListener('input', () => {

  clearTimeout(suggestionTimer);

  const { query } = currentRecipientFragment();

  if (query.length < 2) {

    suggestionRequestId++;

    hideSuggestions();

    return;
  }

  suggestionTimer = setTimeout(() => {

    lookupRecipientSuggestions(query);

  }, 220);

});


/* Keyboard navigation */

to.addEventListener('keydown', event => {

  if (!suggestionBox.classList.contains('show')) return;

  if (
    event.key === 'ArrowDown' ||
    event.key === 'ArrowUp'
  ) {

    event.preventDefault();

    const delta =
      event.key === 'ArrowDown' ? 1 : -1;

    activeSuggestion =
      (
        activeSuggestion +
        delta +
        suggestionItems.length
      ) % suggestionItems.length;

    [
      ...suggestionBox.querySelectorAll(
        '.recipient-suggestion'
      )
    ].forEach((el, i) => {

      el.classList.toggle(
        'active',
        i === activeSuggestion
      );

      el.setAttribute(
        'aria-selected',
        String(i === activeSuggestion)
      );

    });

  } else if (
    event.key === 'Enter' &&
    activeSuggestion >= 0
  ) {

    event.preventDefault();

    chooseSuggestion(activeSuggestion);

  } else if (event.key === 'Escape') {

    hideSuggestions();

  }

});


/* Mouse selection */

suggestionBox.addEventListener('mousedown', event => {

  const button =
    event.target.closest('.recipient-suggestion');

  if (!button) return;

  event.preventDefault();

  chooseSuggestion(
    Number(button.dataset.index)
  );

});


/* Close when clicking outside */

document.addEventListener('click', event => {

  if (
    !event.target.closest('.recipient-suggest-wrap')
  ) {
    hideSuggestions();
  }

});

  /* =========================================================
     URL PARAMETERS
     
     New compose:
       compose.html

     Reply:
       compose.html?mode=reply&id=123

     Forward:
       compose.html?mode=forward&id=123
  ========================================================= */

  const params =
    new URLSearchParams(window.location.search);

  const mode =
    String(params.get('mode') || 'new').toLowerCase();

  const originalMailId =
    params.get('id') ||
    params.get('replyTo') ||
    params.get('forwardTo') ||
    '';


  let originalMessage = null;
  let originalAttachmentsData = [];


  /* =========================================================
     HELPERS
  ========================================================= */

  function showAlert(message, type = 'danger') {

    alertBox.textContent = message;

    alertBox.className =
      `alert alert-${type}`;

  }


  function hideAlert() {

    alertBox.className =
      'alert d-none';

    alertBox.textContent = '';

  }


  function showLoading(message) {

    loadingText.textContent = message;

    loadingBox.classList.add('show');

  }


  function hideLoading() {

    loadingBox.classList.remove('show');

  }


  function cleanSubject(value) {

    let s = String(value || '').trim();

    s = s.replace(
      /^(re|fw|fwd)\s*:\s*/i,
      ''
    );

    return s.trim();

  }


  function replySubject(value) {

    const s = cleanSubject(value);

    return s
      ? `Re: ${s}`
      : 'Re:';

  }


  function forwardSubject(value) {

    const s = cleanSubject(value);

    return s
      ? `Fwd: ${s}`
      : 'Fwd:';

  }


  function escapeHtml(value) {

    return String(value ?? '')
      .replace(/[&<>"']/g, ch => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      }[ch]));

  }


  function escapeAttr(value) {

    return escapeHtml(value);

  }


  function formatSize(bytes) {

    const n = Number(bytes || 0);

    if (!n) return '';

    if (n < 1024)
      return `${n} B`;

    if (n < 1024 * 1024)
      return `${(n / 1024).toFixed(1)} KB`;

    if (n < 1024 * 1024 * 1024)
      return `${(n / 1024 / 1024).toFixed(1)} MB`;

    return `${(n / 1024 / 1024 / 1024).toFixed(1)} GB`;

  }


  function attachmentIcon(mimeType, fileName) {

    const mime =
      String(mimeType || '').toLowerCase();

    const name =
      String(fileName || '').toLowerCase();

    if (
      mime.includes('pdf') ||
      name.endsWith('.pdf')
    ) {
      return 'bi-file-earmark-pdf-fill text-danger';
    }

    if (
      mime.startsWith('image/') ||
      /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(name)
    ) {
      return 'bi-file-earmark-image-fill text-primary';
    }

    if (
      mime.includes('word') ||
      /\.(doc|docx)$/i.test(name)
    ) {
      return 'bi-file-earmark-word-fill text-primary';
    }

    if (
      mime.includes('excel') ||
      /\.(xls|xlsx|csv)$/i.test(name)
    ) {
      return 'bi-file-earmark-spreadsheet-fill text-success';
    }

    if (
      mime.includes('zip') ||
      /\.(zip|rar|7z)$/i.test(name)
    ) {
      return 'bi-file-earmark-zip-fill text-warning';
    }

    return 'bi-paperclip text-secondary';

  }


  /* =========================================================
     MODE UI
  ========================================================= */

  function configureMode() {

    if (mode === 'reply') {

      cardTitle.textContent =
        'Reply';

      modeBadge.textContent =
        'Reply';

      modeBadge.className =
        'badge text-bg-primary mode-badge';

      breadcrumbMode.textContent =
        'Reply';

      document.title =
        'MailBox | Mailbox - Reply';

      return;
    }


    if (mode === 'forward') {

      cardTitle.textContent =
        'Forward Message';

      modeBadge.textContent =
        'Forward';

      modeBadge.className =
        'badge text-bg-secondary mode-badge';

      breadcrumbMode.textContent =
        'Forward';

      document.title =
        'MailBox | Mailbox - Forward';

      return;
    }


    cardTitle.textContent =
      'New Message';

    modeBadge.className =
      'badge text-bg-primary mode-badge d-none';

    breadcrumbMode.textContent =
      'Compose';

    document.title =
      'MailBox | Mailbox - Compose';

  }


  /* =========================================================
     RENDER ORIGINAL ATTACHMENTS
  ========================================================= */

  function renderOriginalAttachments(items) {

    originalAttachmentList.innerHTML = '';

    if (
      !Array.isArray(items) ||
      !items.length
    ) {

      originalAttachments.classList.add('d-none');

      return;
    }


    originalAttachments.classList.remove('d-none');


    originalAttachmentList.innerHTML =
      items.map((item, index) => {

        const fileName =
          item.fileName ||
          item.name ||
          `Attachment ${index + 1}`;

        const mimeType =
          item.mimeType ||
          item.type ||
          '';

        const size =
          formatSize(item.size);

        const icon =
          attachmentIcon(
            mimeType,
            fileName
          );

        return `
          <div class="original-attachment">

            <i
              class="bi ${icon} fs-4"
              aria-hidden="true"
            ></i>

            <div class="attachment-name">

              <span
                title="${escapeAttr(fileName)}"
              >
                ${escapeHtml(fileName)}
              </span>

              <small class="text-secondary">
                ${escapeHtml(size || mimeType)}
              </small>

            </div>

            <span
              class="badge text-bg-success"
              data-original-attachment-status="${index}"
            >
              Loading…
            </span>

          </div>
        `;

      }).join('');

  }


  /* =========================================================
     CONVERT HTML MESSAGE TO TEXT
  ========================================================= */

  function htmlToText(html) {

    const div =
      document.createElement('div');

    div.innerHTML =
      String(html || '');

    return div.innerText ||
      div.textContent ||
      '';

  }


  /* =========================================================
     CREATE FORWARDED MESSAGE
  ========================================================= */

  function createForwardedMessage(message) {

    const senderName =
      message.senderName ||
      message.senderEmail ||
      '';

    const senderEmail =
      message.senderEmail ||
      '';

    const date =
      message.date ||
      '';

    const toValue =
      message.to ||
      '';

    const ccValue =
      message.cc ||
      '';

    const originalBody =
      String(message.body || '');

    let textBody =
      String(message.bodyType || '').toUpperCase() === 'HTML'
        ? htmlToText(originalBody)
        : originalBody;


    return [
      '',
      '',
      '---------- Forwarded message ----------',
      `From: ${senderName}${senderEmail ? ` <${senderEmail}>` : ''}`,
      `Date: ${date}`,
      `Subject: ${message.subject || '(No subject)'}`,
      `To: ${toValue}`,
      ccValue ? `Cc: ${ccValue}` : '',
      '',
      textBody
    ]
      .filter(Boolean)
      .join('\n');

  }


  /* =========================================================
     LOAD ORIGINAL MESSAGE
  ========================================================= */

  async function loadOriginalMessage() {

    if (
      mode === 'new' ||
      !originalMailId
    ) {
      return;
    }


    showLoading(
      mode === 'reply'
        ? 'Loading message for reply…'
        : 'Loading message for forwarding…'
    );


    try {

      const result =
        await MailboxAPI.get(
          originalMailId
        );


      originalMessage =
        result?.message || {};

      originalAttachmentsData =
        Array.isArray(result?.attachments)
          ? result.attachments
          : [];


      if (!originalMessage) {

        throw new Error(
          'Original message could not be loaded.'
        );

      }


      document.title =
        `${originalMessage.subject || 'Message'} | MailBox`;


      /* =====================================================
         REPLY
      ===================================================== */

      if (mode === 'reply') {

        to.value =
          originalMessage.senderEmail ||
          '';

        cc.value = '';

        bcc.value = '';

        subject.value =
          replySubject(
            originalMessage.subject
          );

        body.value = '';

        attachmentStatus.textContent =
          'Original attachments are not included automatically in a reply.';

      }


      /* =====================================================
         FORWARD
      ===================================================== */

      if (mode === 'forward') {

        to.value = '';

        cc.value = '';

        bcc.value = '';

        subject.value =
          forwardSubject(
            originalMessage.subject
          );


        /*
         * Put the exact original message into
         * the compose body.
         */
        body.value =
          createForwardedMessage(
            originalMessage
          );


        renderOriginalAttachments(
          originalAttachmentsData
        );


        /*
         * Try to physically download the original
         * attachments and place them into the
         * file input.
         */
        await prepareForwardAttachments(
          originalAttachmentsData
        );

      }

    } catch (err) {

      console.error(
        'Unable to load original message:',
        err
      );

      showAlert(
        err.message ||
        'Unable to load the original message.'
      );

    } finally {

      hideLoading();

    }

  }


  /* =========================================================
     FETCH ATTACHMENT
  ========================================================= */

  async function fetchAttachmentAsFile(item) {

    if (!item) {
      throw new Error(
        'Invalid attachment.'
      );
    }


    /*
     * If the API already provides base64,
     * use it directly.
     */
    if (
      item.base64 ||
      item.data
    ) {

      const base64 =
        item.base64 ||
        item.data;

      const binary =
        atob(base64);

      const bytes =
        new Uint8Array(
          binary.length
        );

      for (
        let i = 0;
        i < binary.length;
        i++
      ) {
        bytes[i] =
          binary.charCodeAt(i);
      }


      return new File(
        [bytes],
        item.fileName ||
        item.name ||
        'attachment',
        {
          type:
            item.mimeType ||
            item.type ||
            'application/octet-stream'
        }
      );

    }


    /*
     * Otherwise use the attachment URL.
     */
    const url =
      item.url ||
      item.downloadUrl ||
      item.fileUrl;


    if (!url) {

      throw new Error(
        'Attachment URL is missing.'
      );

    }


    const response =
      await fetch(
        url,
        {
          method: 'GET',
          credentials: 'omit'
        }
      );


    if (!response.ok) {

      throw new Error(
        `Unable to download ${item.fileName || 'attachment'}`
      );

    }


    const blob =
      await response.blob();


    return new File(
      [blob],
      item.fileName ||
      item.name ||
      'attachment',
      {
        type:
          item.mimeType ||
          blob.type ||
          'application/octet-stream'
      }
    );

  }


  /* =========================================================
     PUT FILES INTO FILE INPUT
  ========================================================= */

  async function prepareForwardAttachments(items) {

    if (
      !Array.isArray(items) ||
      !items.length
    ) {

      attachmentStatus.textContent =
        'This message has no attachments.';

      return;

    }


    const forwardedFiles = [];


    for (
      let index = 0;
      index < items.length;
      index++
    ) {

      const item =
        items[index];

      const status =
        document.querySelector(
          `[data-original-attachment-status="${index}"]`
        );


      try {

        const file =
          await fetchAttachmentAsFile(
            item
          );


        forwardedFiles.push(file);


        if (status) {

          status.textContent =
            'Attached';

          status.className =
            'badge text-bg-success';

        }

      } catch (err) {

        console.warn(
          'Unable to copy attachment:',
          item,
          err
        );


        if (status) {

          status.textContent =
            'Could not attach';

          status.className =
            'badge text-bg-warning';

        }

      }

    }


    /*
     * Browser security does not allow assigning
     * a normal array directly to input.files.
     *
     * DataTransfer is used to create a FileList.
     */
    if (forwardedFiles.length) {

      const transfer =
        new DataTransfer();


      for (const file of forwardedFiles) {

        transfer.items.add(file);

      }


      /*
       * Also preserve any files that the user
       * may already have selected manually.
       */
      for (
        const existingFile of files.files
      ) {

        transfer.items.add(
          existingFile
        );

      }


      files.files =
        transfer.files;


      attachmentStatus.textContent =
        `${forwardedFiles.length} original attachment(s) added to this message.`;

    } else {

      attachmentStatus.textContent =
        'Original attachments could not be copied automatically.';

    }

  }


  /* =========================================================
     READ CURRENT FILES
  ========================================================= */

  async function readFiles() {

    const arr = [];


    for (
      const file of files.files
    ) {

      const base64 =
        await new Promise(
          (resolve, reject) => {

            const reader =
              new FileReader();


            reader.onload = () => {

              const result =
                String(
                  reader.result || ''
                );

              resolve(
                result.split(',')[1] || ''
              );

            };


            reader.onerror =
              reject;


            reader.readAsDataURL(
              file
            );

          }
        );


      arr.push({

        name:
          file.name,

        size:
          file.size,

        mimeType:
          file.type,

        base64

      });

    }


    return arr;

  }


  /* =========================================================
     CLEAR FORM
  ========================================================= */

  function clearForm() {

    to.value = '';
    cc.value = '';
    bcc.value = '';
    subject.value = '';
    body.value = '';

    /*
     * File inputs cannot always be cleared by
     * setting files directly, but this works
     * in normal browsers.
     */
    files.value = '';

    originalAttachments.classList.add(
      'd-none'
    );

    originalAttachmentList.innerHTML = '';

    attachmentStatus.textContent = '';

  }


  /* =========================================================
     SEND
  ========================================================= */

  sendBtn.addEventListener(
    'click',
    async () => {

      hideAlert();

      const recipient =
        to.value.trim();


      if (!recipient) {

        showAlert(
          'Please enter at least one recipient.',
          'warning'
        );

        to.focus();

        return;

      }


      if (!subject.value.trim()) {

        if (
          !confirm(
            'The subject is empty. Send anyway?'
          )
        ) {
          subject.focus();
          return;
        }

      }


      try {

        sendBtn.disabled = true;

        draftBtn.disabled = true;

        discardBtn.disabled = true;


        const attachments =
          await readFiles();


        const result =
          await MailboxAPI.send({

            to:
              to.value,

            cc:
              cc.value,

            bcc:
              bcc.value,

            subject:
              subject.value,

            body:
              body.value,

            bodyType:
              'TEXT',

            attachments:

              attachments

          });


        alert(
          'Message sent successfully.\n\n' +
          'Reference: ' +
          (
            result.referenceNo ||
            ''
          )
        );


        clearForm();


        window.location.href =
          'mailbox.html';


      } catch (err) {

        console.error(
          'Send failed:',
          err
        );

        showAlert(
          err.message ||
          'Unable to send message.'
        );

      } finally {

        sendBtn.disabled = false;

        draftBtn.disabled = false;

        discardBtn.disabled = false;

      }

    }
  );


  /* =========================================================
     SAVE DRAFT
  ========================================================= */

  draftBtn.addEventListener(
    'click',
    async () => {

      hideAlert();

      try {

        draftBtn.disabled = true;


        const result =
          await MailboxAPI.draft({

            to:
              to.value,

            cc:
              cc.value,

            bcc:
              bcc.value,

            subject:
              subject.value,

            body:
              body.value,

            bodyType:
              'TEXT'

          });


        showAlert(
          'Draft saved successfully.' +
          (
            result.referenceNo
              ? ` Reference: ${result.referenceNo}`
              : ''
          ),
          'success'
        );


      } catch (err) {

        console.error(
          'Draft failed:',
          err
        );

        showAlert(
          err.message ||
          'Unable to save draft.'
        );

      } finally {

        draftBtn.disabled = false;

      }

    }
  );


  /* =========================================================
     DISCARD
  ========================================================= */

  discardBtn.addEventListener(
    'click',
    () => {

      if (
        !confirm(
          'Discard this message?'
        )
      ) {
        return;
      }


      clearForm();


      window.location.href =
        'mailbox.html';

    }
  );


  /* =========================================================
     MANUAL FILE SELECTION
     
     If user chooses additional files, don't
     remove the automatically forwarded files.
  ========================================================= */

  files.addEventListener(
    'change',
    () => {

      const count =
        files.files.length;


      if (!count) {

        if (mode === 'forward') {

          attachmentStatus.textContent =
            originalAttachmentsData.length
              ? 'Original attachments are being prepared.'
              : '';

        } else {

          attachmentStatus.textContent =
            '';

        }

        return;

      }


      attachmentStatus.textContent =
        `${count} attachment(s) selected.`;

    }
  );


  /* =========================================================
     INITIALIZE
  ========================================================= */

  configureMode();

  loadOriginalMessage();

})();
</script>


<!-- SIDEBAR SCROLLBAR -->
<script>
(() => {

  const sidebarWrapper =
    document.querySelector(
      '.sidebar-wrapper'
    );

  const isMobile =
    window.innerWidth <= 992;


  if (
    sidebarWrapper &&
    globalThis.OverlayScrollbarsGlobal?.OverlayScrollbars &&
    !isMobile
  ) {

    globalThis
      .OverlayScrollbarsGlobal
      .OverlayScrollbars(
        sidebarWrapper,
        {
          scrollbars: {
            theme:
              'os-theme-light',

            autoHide:
              'leave',

            clickScroll:
              true
          }
        }
      );

  }

})();
</script>
