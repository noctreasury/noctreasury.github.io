<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Mailbox</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f3f6fa;--panel:#fff;--soft:#f8fafc;--text:#172033;--muted:#6b7280;--border:#e4e9f0;--primary:#2563eb;--primary2:#4f46e5;--danger:#dc2626;--success:#16a34a;--warning:#d97706;--hover:#f1f5f9;--selected:#eaf2ff;--shadow:0 18px 55px rgba(20,35,60,.14)}
@media(prefers-color-scheme:dark){:root{--bg:#0c1117;--panel:#111820;--soft:#151d27;--text:#edf2f7;--muted:#9aa6b6;--border:#27313d;--hover:#18222d;--selected:#172d4e;--shadow:0 18px 55px rgba(0,0,0,.35)}}
html,body{width:100%;height:100%;overflow:hidden;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.app{height:100vh;display:flex;flex-direction:column}
.topbar{height:68px;flex:none;display:flex;align-items:center;gap:20px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--border);z-index:50}
.brand{display:flex;align-items:center;gap:11px;min-width:225px}.brand-logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary2))}.brand-logo svg{width:22px}.brand-name{font-size:16px;font-weight:750}.brand-sub{font-size:11px;color:var(--muted);margin-top:2px}
.search{flex:1;max-width:600px;margin:auto;position:relative}.search input{width:100%;height:42px;border:1px solid var(--border);background:var(--soft);border-radius:13px;outline:0;padding:0 42px;color:var(--text);font-size:13px}.search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.09)}.search-icon{position:absolute;left:14px;top:12px;color:var(--muted)}.clear-search{position:absolute;right:8px;top:6px;width:30px;height:30px;border:0;background:transparent;color:var(--muted);border-radius:8px;display:none}.clear-search:hover{background:var(--hover)}
.account{min-width:225px;display:flex;justify-content:flex-end;align-items:center;gap:10px}.avatar,.read-avatar{border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary2));font-weight:700}.avatar{width:37px;height:37px;font-size:13px}.account-info{text-align:right}.account-name{font-size:13px;font-weight:700}.account-role{color:var(--muted);font-size:11px}.icon-btn{width:38px;height:38px;border:0;border-radius:11px;background:transparent;color:var(--muted);display:grid;place-items:center}.icon-btn:hover{background:var(--hover);color:var(--text)}.icon-btn svg{width:18px;height:18px}
.main{flex:1;min-height:0;display:flex}.sidebar{width:235px;flex:none;background:var(--panel);border-right:1px solid var(--border);padding:18px 12px;overflow:auto;scrollbar-gutter:stable}.compose-btn{width:100%;height:46px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:20px;box-shadow:0 9px 20px rgba(37,99,235,.20)}.compose-btn:hover{transform:translateY(-1px)}.folder-title{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:0 12px 8px}.folder{width:100%;height:40px;display:flex;align-items:center;border:0;background:transparent;color:var(--text);border-radius:11px;padding:0 11px;gap:11px;font-size:13px;margin-bottom:3px;text-align:left}.folder:hover{background:var(--hover)}.folder.active{background:var(--selected);color:var(--primary);font-weight:700}.folder svg,.folder i{width:17px;height:17px;flex:none;font-size:16px;display:grid;place-items:center}.folder-count{margin-left:auto;min-width:22px;padding:2px 6px;border-radius:10px;background:var(--primary);color:#fff;font-size:10px;font-weight:700;text-align:center}.logout-side{margin-top:20px;padding-top:15px;border-top:1px solid var(--border)}.logout-side button{width:100%;border:0;background:transparent;height:40px;border-radius:11px;display:flex;align-items:center;gap:11px;padding:0 11px;color:var(--danger);font-size:13px}.logout-side button:hover{background:rgba(220,38,38,.08)}
.mail-area{width:430px;flex:0 0 430px;min-width:320px;max-width:75vw;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}.list-head{height:58px;flex:none;padding:0 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}.list-title{font-size:15px;font-weight:750}.list-actions{display:flex;gap:3px}.mail-list{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}.mail-row{min-height:82px;border-bottom:1px solid var(--border);padding:13px 15px;display:flex;gap:10px;position:relative;cursor:pointer;transition:.12s}.mail-row:hover{background:var(--hover)}.mail-row.selected{background:var(--selected)}.mail-row.unread{background:rgba(37,99,235,.035)}.mail-row.unread .sender{font-weight:750}.mail-check{width:18px;flex:none;padding-top:3px}.mail-check input{width:15px;height:15px;accent-color:var(--primary)}.mail-main{min-width:0;flex:1}.mail-top{display:flex;align-items:center;gap:8px}.sender{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.date{margin-left:auto;flex:none;color:var(--muted);font-size:10px}.subject{font-size:12px;font-weight:650;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preview{color:var(--muted);font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.star{width:22px;height:22px;flex:none;border:0;background:transparent;color:#a3adba;display:grid;place-items:center;border-radius:7px}.star:hover{background:var(--hover)}.star.active{color:#f59e0b}.star svg{width:15px}.attachment-dot{display:inline-flex;margin-left:4px;color:var(--muted)}.empty{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--muted);padding:30px;text-align:center}.empty svg{width:46px;height:46px;margin-bottom:12px;opacity:.45}.empty-title{color:var(--text);font-weight:700;font-size:14px;margin-bottom:5px}.empty-text{font-size:12px}
.toolbar{display:none;padding:7px 12px;border-bottom:1px solid var(--border);gap:3px}.toolbar.show{display:flex}.toolbar .icon-btn{width:34px;height:34px}
.pager{height:46px;flex:none;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:var(--muted);font-size:10px}.pager button{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:8px}.pager button:hover:not(:disabled){background:var(--hover);color:var(--text)}.pager button:disabled{opacity:.35;cursor:not-allowed}.pager select{border:1px solid var(--border);background:var(--soft);color:var(--text);border-radius:7px;font-size:10px;padding:4px}
.splitter{width:12px;flex:none;background:var(--border);cursor:col-resize;position:relative;z-index:20;touch-action:none}.splitter:after{content:"";position:absolute;inset:0 -8px;cursor:col-resize}.splitter:before{content:"";position:absolute;left:4px;top:50%;width:3px;height:54px;transform:translateY(-50%);border-radius:4px;background:var(--muted);opacity:.22}.splitter:hover,.splitter.dragging{background:rgba(37,99,235,.18)}.splitter:hover:before,.splitter.dragging:before{opacity:.7;background:var(--primary)}
.read-pane{flex:1;min-width:320px;background:var(--panel);display:flex;flex-direction:column}.read-empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--muted)}.read-empty svg{width:58px;height:58px;opacity:.35;margin-bottom:15px}.read-empty strong{color:var(--text);font-size:14px;margin-bottom:5px}.read-empty span{font-size:12px}.read-header{flex:none;overflow:visible;scrollbar-gutter:stable;padding:20px 25px 16px;border-bottom:1px solid var(--border)}.read-actions{display:flex;align-items:center;gap:5px;margin-bottom:20px}.read-actions .icon-btn{width:35px;height:35px}.read-subject{font-size:21px;line-height:1.3;font-weight:750;word-break:break-word}.read-meta{display:flex;gap:11px;align-items:flex-start;margin-top:17px}.read-avatar{width:38px;height:38px;flex:none;font-size:12px}.read-sender{min-width:0;flex:1}.read-sender-name{font-weight:700;font-size:13px}.read-sender-email{color:var(--muted);font-size:11px;margin-top:2px}.read-date{color:var(--muted);font-size:11px}.read-recipients{color:var(--muted);font-size:11px;margin-top:7px;line-height:1.5}.read-content{min-height:0;overflow:auto;scrollbar-gutter:stable;display:flex;flex-direction:column}.read-body{flex:none;min-height:0;overflow:visible;padding:26px;font-size:13px;line-height:1.7;word-break:break-word}.read-body img{max-width:100%;height:auto}.read-body a{color:var(--primary)}.attachment-list{max-height:180px;overflow:auto;scrollbar-gutter:stable;padding:0 26px 20px;display:flex;flex-wrap:wrap;gap:7px}.attachment{display:inline-flex;align-items:center;gap:8px;padding:9px 11px;border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:11px;background:var(--soft);text-decoration:none}.attachment:hover{border-color:var(--primary)}
.modal{position:fixed;inset:0;background:rgba(10,15,25,.52);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}.modal.show{display:flex}.compose{width:100%;max-width:720px;max-height:calc(100vh - 36px);background:var(--panel);border:1px solid var(--border);border-radius:19px;box-shadow:0 30px 80px rgba(0,0,0,.28);overflow:hidden;display:flex;flex-direction:column}.compose-head{height:55px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border)}.compose-title{font-size:14px;font-weight:750}.mode-badge{font-size:9px;margin-left:7px;padding:3px 6px;border-radius:8px;background:var(--selected);color:var(--primary)}.compose-body{padding:15px 18px;overflow:auto;scrollbar-gutter:stable}.compose-row{display:flex;align-items:center;min-height:42px;border-bottom:1px solid var(--border);gap:9px}.compose-label{width:55px;flex:none;color:var(--muted);font-size:12px}.compose-input{flex:1;min-width:0;height:38px;border:0;outline:0;background:transparent;color:var(--text);font-size:13px}.compose-area{width:100%;min-height:260px;border:0;outline:0;resize:vertical;padding:16px 0;background:transparent;color:var(--text);font-size:13px;line-height:1.7}.compose-foot{min-height:62px;flex:none;padding:10px 15px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}.compose-left{display:flex;gap:4px;align-items:center}.send-btn{min-width:108px;height:39px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:12px;font-weight:700;display:flex;justify-content:center;align-items:center;gap:8px}.send-btn:disabled{opacity:.7;cursor:not-allowed}.send-only-spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}.send-spinner{display:none;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}.send-btn.loading .send-only-spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}.send-spinner{display:block}.send-btn.loading .send-label{display:none}.secondary-btn{height:35px;border:1px solid var(--border);background:var(--soft);color:var(--text);border-radius:9px;padding:0 11px;font-size:11px}.secondary-btn:hover{background:var(--hover)}.file-list{display:flex;flex-wrap:wrap;gap:6px;padding:9px 0}.file-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--soft);border-radius:8px;padding:6px 8px;font-size:10px;max-width:100%}.file-chip span{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-chip button{border:0;background:transparent;color:var(--muted);padding:0}.compose-status{font-size:10px;color:var(--muted);min-height:15px;padding-top:4px}.autocomplete{position:absolute;left:74px;right:18px;top:41px;z-index:10;background:var(--panel);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);overflow:hidden;display:none}.autocomplete.show{display:block}.suggestion{padding:9px 11px;cursor:pointer;border-bottom:1px solid var(--border)}.suggestion:last-child{border-bottom:0}.suggestion:hover{background:var(--hover)}.suggestion-name{font-size:12px;font-weight:650}.suggestion-email{color:var(--muted);font-size:10px;margin-top:2px}.compose-to-wrap{position:relative;flex:1}.alert{padding:9px 11px;border-radius:9px;font-size:11px;margin-bottom:10px}.alert.error{background:rgba(220,38,38,.09);color:var(--danger);border:1px solid rgba(220,38,38,.18)}.alert.success{background:rgba(22,163,74,.09);color:var(--success);border:1px solid rgba(22,163,74,.18)}.alert.warning{background:rgba(217,119,6,.09);color:var(--warning);border:1px solid rgba(217,119,6,.18)}
.success-box{width:100%;max-width:390px;background:var(--panel);border:1px solid var(--border);border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,.3);padding:30px;text-align:center}.success-icon{width:70px;height:70px;border-radius:50%;margin:0 auto 15px;background:rgba(22,163,74,.12);color:var(--success);display:grid;place-items:center;animation:pop .45s ease}.success-icon svg{width:34px;height:34px}.success-box h3{font-size:18px;margin-bottom:6px}.success-box p{font-size:12px;color:var(--muted)}.reference{display:inline-flex;margin-top:12px;padding:7px 10px;border-radius:8px;background:var(--soft);font-size:11px;color:var(--muted)}
.panel-spinner{width:20px;height:20px;border:2px solid rgba(37,99,235,.18);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}.loading-inline{display:flex;align-items:center;justify-content:center;min-height:120px;color:var(--muted)}.loading-overlay{position:fixed;inset:0;background:rgba(243,246,250,.76);backdrop-filter:blur(3px);z-index:250;display:none;align-items:center;justify-content:center}.loading-overlay.show{display:flex}.loading-box{padding:16px;border-radius:14px;background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;font-size:0}.big-spinner{width:21px;height:21px;border:2px solid rgba(37,99,235,.2);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
.mobile-back{display:none!important}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pop{0%{transform:scale(.65);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@media(max-width:1000px){.sidebar{width:190px}.mail-area{width:360px}.account-info{display:none}}
@media(max-width:760px){.topbar{padding:0 10px;gap:8px}.brand{min-width:auto}.brand-sub,.brand-name{display:none}.search{margin:0 5px}.account{min-width:auto}.sidebar{width:64px;padding:12px 7px}.compose-btn span,.folder span:not(.folder-count),.logout-side span{display:none}.compose-btn{height:42px}.folder{justify-content:center;padding:0}.folder-count{position:absolute;margin:0;transform:translate(12px,-11px);min-width:16px;font-size:8px;padding:1px 4px}.folder{position:relative}.folder-title{display:none}.mail-area{width:calc(100vw - 64px);border-right:0}.splitter{display:none}.read-pane{position:fixed;inset:68px 0 0 64px;z-index:30;display:none}.read-pane.mobile-show{display:flex}.mobile-back{display:grid!important}.compose{max-height:calc(100vh - 20px);border-radius:15px}}
@media(max-width:520px){.search input{height:38px}.read-header{padding:16px}.read-body{padding:18px}.compose{max-height:100vh}.compose-body{padding:12px}.compose-area{min-height:220px}.compose-foot{align-items:flex-end}.brand-logo{width:36px;height:36px}.mail-area{width:calc(100vw - 64px)}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="brand-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h16v13H4z"/><path d="m4 7 8 6 8-6"/></svg></div><div><div class="brand-name">Mailbox</div><div class="brand-sub"></div></div></div>
  <div class="search"><svg class="search-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="searchInput" type="search" placeholder="Search mail..." autocomplete="off"><button id="clearSearch" class="clear-search" type="button">×</button></div>
  <div class="account"><button id="refreshBtn" class="icon-btn" title="Refresh"><i class="bi bi-arrow-clockwise"></i></button><div class="account-info"><div id="accountName" class="account-name">User</div><div id="accountRole" class="account-role">Mailbox User</div></div><div id="avatar" class="avatar">U</div></div>
</header>
<main class="main">
<aside class="sidebar">
  <button id="composeBtn" class="compose-btn"><i class="bi bi-pencil-square"></i><span>Compose</span></button>
  <div class="folder-title">Folders</div>
  <button class="folder active" data-folder="INBOX"><i class="bi bi-inbox"></i><span>Inbox</span><b id="inboxCount" class="folder-count hidden">0</b></button>
  <button class="folder" data-folder="SENT"><i class="bi bi-send"></i><span>Sent</span></button>
  <button class="folder" data-folder="DRAFT"><i class="bi bi-file-earmark-text"></i><span>Drafts</span></button>
  <button class="folder" data-folder="STARRED"><i class="bi bi-star"></i><span>Starred</span></button>
  <button class="folder" data-folder="ARCHIVE"><i class="bi bi-archive"></i><span>Archive</span></button>
  <button class="folder" data-folder="SPAM"><i class="bi bi-exclamation-triangle"></i><span>Spam</span></button>
  <button class="folder" data-folder="TRASH"><i class="bi bi-trash3"></i><span>Trash</span></button>
  <div class="logout-side"><button id="logoutBtn"><i class="bi bi-box-arrow-right"></i><span>Logout</span></button></div>
</aside>
<section class="mail-area">
  <div class="list-head"><div id="listTitle" class="list-title">Inbox</div><div class="list-actions"><button id="selectAllBtn" class="icon-btn" title="Select all"><i class="bi bi-check2-square"></i></button><button id="refreshListBtn" class="icon-btn" title="Refresh"><i class="bi bi-arrow-clockwise"></i></button></div></div>
  <div id="toolbar" class="toolbar"><button class="icon-btn" id="markReadBtn" title="Mark read"><i class="bi bi-envelope-open"></i></button><button class="icon-btn" id="markUnreadBtn" title="Mark unread"><i class="bi bi-envelope"></i></button><button class="icon-btn" id="archiveBtn" title="Archive"><i class="bi bi-archive"></i></button><button class="icon-btn" id="spamBtn" title="Spam"><i class="bi bi-exclamation-octagon"></i></button><button class="icon-btn" id="deleteBtn" title="Trash"><i class="bi bi-trash3"></i></button></div>
  <div id="mailList" class="mail-list"><div class="loading-inline"><span class="panel-spinner" aria-label="Loading"></span></div></div>
  <div class="pager"><span id="rangeText">—</span><div style="display:flex;align-items:center;gap:5px"><select id="pageSize"><option value="25">25</option><option value="50">50</option></select><button id="prevPage" disabled>‹</button><span id="pageText">1 / 1</span><button id="nextPage" disabled>›</button></div></div>
</section>
<div id="paneSplitter" class="splitter" role="separator" aria-orientation="vertical" aria-label="Resize mail list and reading pane" title="Drag to resize"></div>
<section id="readPane" class="read-pane">
  <div id="readEmpty" class="read-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg><strong>Select a message</strong><span>Choose an email from the list to read it here.</span></div>
  <div id="readContent" class="read-content hidden">
    <div class="read-header"><div class="read-actions"><button id="backBtn" class="icon-btn mobile-back" title="Back"><i class="bi bi-chevron-left"></i></button><button id="replyBtn" class="icon-btn" title="Reply"><i class="bi bi-reply"></i></button><button id="forwardBtn" class="icon-btn" title="Forward"><i class="bi bi-forward"></i></button><button id="readArchiveBtn" class="icon-btn" title="Archive"><i class="bi bi-archive"></i></button><button id="readDeleteBtn" class="icon-btn" title="Trash"><i class="bi bi-trash3"></i></button><button id="readStarBtn" class="icon-btn" title="Star"><i class="bi bi-star"></i></button></div><div id="readSubject" class="read-subject">(No subject)</div><div class="read-meta"><div id="readAvatar" class="read-avatar">U</div><div class="read-sender"><div id="readSenderName" class="read-sender-name"></div><div id="readSenderEmail" class="read-sender-email"></div><div id="readRecipients" class="read-recipients"></div></div><div id="readDate" class="read-date"></div></div></div>
    <div id="readBody" class="read-body"></div><div id="attachmentList" class="attachment-list"></div>
  </div>
</section>
</main>
</div>

<!-- Compose / Reply / Forward -->
<div id="composeModal" class="modal" aria-hidden="true">
  <div class="compose">
    <div class="compose-head"><div><span id="composeTitle" class="compose-title">New message</span><span id="modeBadge" class="mode-badge hidden"></span></div><button id="closeCompose" class="icon-btn" type="button" title="Close"><i class="bi bi-x-lg"></i></button></div>
    <div class="compose-body">
      <div id="composeAlert" class="alert hidden"></div>
      <div id="composeLoading" class="alert hidden">Loading original message…</div>
      <div class="compose-row"><label class="compose-label">To</label><div class="compose-to-wrap"><input id="mailTo" class="compose-input" autocomplete="off" placeholder="Recipient email"><div id="suggestions" class="autocomplete"></div></div></div>
      <div class="compose-row"><label class="compose-label">Cc</label><input id="mailCc" class="compose-input" autocomplete="off" placeholder="Optional"></div>
      <div class="compose-row"><label class="compose-label">Bcc</label><input id="mailBcc" class="compose-input" autocomplete="off" placeholder="Optional"></div>

<script>
/* =========================================================
   API CLIENT - same API contract as the existing application
   ========================================================= */
window.MAILBOX_API_URL=window.MAILBOX_API_URL||'https://script.google.com/macros/s/AKfycbztFYkp6V7YglnFLtZ7GbEXzoctYiBilV4lA4VgLm3WFKF8lYENWdM90_zy0uC1gmdG/exec';
const MailboxAPI=(()=>{
 async function request(action,payload={}){const response=await fetch(window.MAILBOX_API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action},payload)),redirect:'follow'});if(!response.ok)throw new Error('Server error: '+response.status);const data=await response.json();if(!data.ok)throw new Error(data.error||'Request failed.');return data}
 const token=()=>sessionStorage.getItem('mailbox_token')||'';
 const user=()=>{try{return JSON.parse(sessionStorage.getItem('mailbox_user')||'null')}catch(_){return null}};
 const setSession=data=>{sessionStorage.setItem('mailbox_token',data.token);sessionStorage.setItem('mailbox_user',JSON.stringify(data.user))};
 const clearSession=()=>{sessionStorage.removeItem('mailbox_token');sessionStorage.removeItem('mailbox_user')};
 const requireLogin=()=>{if(!token())location.href='login.html'};
 return{request,token,user,setSession,clearSession,requireLogin,logout:()=>request('logout',{token:token()}),bootstrap:()=>request('bootstrap',{token:token()}),list:(folder,search='',page=1,pageSize=25)=>request('mailbox',{token:token(),folder,search,page,pageSize}),get:mailId=>request('getMessage',{token:token(),mailId}),suggestRecipients:query=>request('suggestRecipients',{token:token(),query}),send:payload=>request('sendMessage',Object.assign({token:token()},payload)),draft:payload=>request('saveDraft',Object.assign({token:token()},payload)),update:payload=>request('updateMessage',Object.assign({token:token()},payload))}
})();

(() => {
'use strict';
MailboxAPI.requireLogin();
const $=id=>document.getElementById(id);
const folders={INBOX:'Inbox',SENT:'Sent',DRAFT:'Drafts',STARRED:'Starred',ARCHIVE:'Archive',SPAM:'Spam',TRASH:'Trash'};
let currentFolder=sessionStorage.getItem('mailbox_folder')||'INBOX';
let currentPage=1,pageSize=25,totalPages=1,currentMessages=[],selectedIds=new Set(),selectedMailId='',selectedMessage=null,selectedAttachments=[];
let searchTimer=null,silentTimer=null,loading=false,loadSequence=0,composeMode='new',originalMessage=null,originalAttachments=[],sending=false,attachmentFiles=[];
const folderCache=new Map();
const folderViews=new Map();
const CACHE_TTL=45000;
let splitterDragging=false;
const user=MailboxAPI.user()||{};
$('accountName').textContent=user.name||user.fullName||user.email||'User';
$('accountRole').textContent=user.designation||user.role||'Mailbox User';
$('avatar').textContent=initials(user.name||user.fullName,user.email||user.emailAddress);

function initials(name,email){const s=String(name||email||'U').trim();const p=s.split(/\s+/).filter(Boolean);return (p.length>1?p[0][0]+p[1][0]:s.slice(0,2)).toUpperCase()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function escAttr(v){return esc(v)}
function formatDate(v){if(!v)return '';const d=new Date(v);if(Number.isNaN(d.getTime()))return String(v);const now=new Date();const same=d.toDateString()===now.toDateString();return same?d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString([], {day:'2-digit',month:'short',year:'numeric'})}
function formatSize(bytes){const n=Number(bytes||0);if(!n)return '';if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';if(n<1073741824)return (n/1048576).toFixed(1)+' MB';return (n/1073741824).toFixed(1)+' GB'}
function showOverlay(){ $('loadingOverlay').classList.add('show'); $('loadingOverlay').setAttribute('aria-hidden','false') }
function hideOverlay(){ $('loadingOverlay').classList.remove('show'); $('loadingOverlay').setAttribute('aria-hidden','true') }
function alertCompose(msg,type='error'){const b=$('composeAlert');b.textContent=msg;b.className='alert '+type}
function hideComposeAlert(){$('composeAlert').className='alert hidden';$('composeAlert').textContent=''}
function saveFolder(){sessionStorage.setItem('mailbox_folder',currentFolder)}
function updateFolderUI(){document.querySelectorAll('.folder').forEach(b=>b.classList.toggle('active',b.dataset.folder===currentFolder));$('listTitle').textContent=folders[currentFolder]||currentFolder}
function signature(list){return (list||[]).map(m=>[m.mailId,m.date,m.subject,m.isRead?'1':'0',m.isStarred?'1':'0'].join('|')).join('~')}

function cacheKey(folder=currentFolder,page=1){return `${folder}|${$('searchInput').value.trim().toLowerCase()}|${page}|${pageSize}`}
function applyMailboxData(data){
 currentMessages=Array.isArray(data.messages)?data.messages:[];
 currentPage=data.page||1;
 totalPages=data.totalPages||1;
 selectedIds.clear();
 renderList();updatePager(data);updateToolbar();folderViews.set(currentFolder,{html:$('mailList').innerHTML,scrollTop:$('mailList').scrollTop,messages:currentMessages,page:currentPage,totalPages:totalPages});
 if(currentFolder==='INBOX'){showInboxCount(currentMessages.filter(m=>!m.isRead).length)}
}
function renderListLoading(){ $('mailList').innerHTML='<div class="loading-inline"><span class="panel-spinner" aria-label="Loading"></span></div>'; }

async function load(page=1,opts={}){
 const seq=++loadSequence;
 const key=cacheKey(currentFolder,page);
 const cached=folderCache.get(key);
 const fresh=cached && (Date.now()-cached.time<CACHE_TTL);
 if(cached){
   applyMailboxData(cached.data);
   if(fresh && opts.cacheOnly)return;
 }
 loading=true;
 if(!cached && !opts.silent)renderListLoading();
 try{
  const data=await MailboxAPI.list(currentFolder,$('searchInput').value.trim(),page,pageSize);
  if(seq!==loadSequence)return;
  folderCache.set(key,{data,time:Date.now()});
  const changed = signature(data.messages||[]) !== signature(currentMessages) || Number(data.total||0)!==Number(currentMessages.length);
  if(changed || !cached) {
    const scrollTop=$('mailList').scrollTop;
    applyMailboxData(data);
    if(cached && opts.silent) requestAnimationFrame(()=>{$('mailList').scrollTop=scrollTop});
  }
 }catch(err){
  if(seq!==loadSequence)return;
  if(/session|login|revoked|inactive/i.test(err.message||'')){MailboxAPI.clearSession();location.href='login.html';return}
  if(!cached) $('mailList').innerHTML='<div class="empty"><div class="empty-title">Unable to load mailbox</div><div class="empty-text">'+esc(err.message||'Request failed.')+'</div></div>';
 }finally{if(seq===loadSequence)loading=false}
}

function showInboxCount(n){const b=$('inboxCount');if(n>0){b.textContent=n;b.classList.remove('hidden')}else b.classList.add('hidden')}
function renderList(){if(!currentMessages.length){$('mailList').innerHTML='<div class="empty"><div class="empty-title">No messages found</div><div class="empty-text">This folder does not contain any messages.</div></div>';return}$('mailList').innerHTML=currentMessages.map(m=>`<div class="mail-row ${m.isRead?'':'unread'} ${m.mailId===selectedMailId?'selected':''}" data-id="${escAttr(m.mailId)}"><div class="mail-check"><input type="checkbox" data-select="${escAttr(m.mailId)}" ${selectedIds.has(m.mailId)?'checked':''}></div><div class="mail-main"><div class="mail-top"><div class="sender">${esc(m.senderName||m.senderEmail||m.to||'Unknown')}</div><div class="date">${esc(formatDate(m.date))}</div></div><div class="subject">${esc(m.subject||'(No subject)')} ${m.hasAttachment?'<span class="attachment-dot"><i class="bi bi-paperclip"></i></span>':''}</div><div class="preview">${esc(m.body||'')}</div></div><button class="star ${m.isStarred?'active':''}" data-star="${escAttr(m.mailId)}" title="${m.isStarred?'Unstar':'Star'}"><i class="bi ${m.isStarred?'bi-star-fill':'bi-star'}"></i></button></div>`).join('');
 document.querySelectorAll('[data-select]').forEach(c=>c.addEventListener('click',e=>{e.stopPropagation();const id=c.dataset.select;if(c.checked)selectedIds.add(id);else selectedIds.delete(id);updateToolbar()}));
 document.querySelectorAll('[data-star]').forEach(b=>b.addEventListener('click',async e=>{e.stopPropagation();const id=b.dataset.star;const m=currentMessages.find(x=>x.mailId===id);try{b.disabled=true;await MailboxAPI.update({mailId:id,Is_Starred:m&&!m.isStarred?'YES':'NO'});invalidateFolderCache();await load(currentPage,{silent:true})}catch(err){alert(err.message||'Unable to update star.')}finally{b.disabled=false}}));
 document.querySelectorAll('.mail-row').forEach(r=>r.addEventListener('click',e=>{if(e.target.closest('input,button'))return;openMessage(r.dataset.id)}));
}
function updatePager(data){const total=Number(data.total||0);const start=total?((currentPage-1)*pageSize+1):0;const end=Math.min(currentPage*pageSize,total);$('rangeText').textContent=total?`${start}-${end} of ${total}`:'0 messages';$('pageText').textContent=`${currentPage} / ${totalPages}`;$('prevPage').disabled=!data.hasPrevious;$('nextPage').disabled=!data.hasNext;$('pageSize').value=String(pageSize)}
function updateToolbar(){$('toolbar').classList.toggle('show',selectedIds.size>0)}
function invalidateFolderCache(folder=currentFolder){for(const k of [...folderCache.keys()])if(k.startsWith(folder+'|'))folderCache.delete(k)}

async function applySelected(changes){const ids=[...selectedIds];if(!ids.length)return;try{await Promise.all(ids.map(mailId=>MailboxAPI.update(Object.assign({mailId},changes))));selectedIds.clear();invalidateFolderCache();await load(currentPage)}catch(err){alert(err.message||'Unable to update messages.')}}

function paintReadHeader(m){
 selectedMailId=m.mailId||selectedMailId;
 $('readSubject').textContent=m.subject||'(No subject)';
 $('readSenderName').textContent=m.senderName||m.senderEmail||m.to||'';
 $('readSenderEmail').textContent=m.senderEmail?`<${m.senderEmail}>`:'';
 $('readAvatar').textContent=initials(m.senderName,m.senderEmail);
 $('readDate').textContent=formatDate(m.date)||m.date||'';
 let rec='To: '+(m.to||'—');if(m.cc)rec+=' • Cc: '+m.cc;if(m.bcc)rec+=' • Bcc: '+m.bcc;
 $('readRecipients').textContent=rec;
 $('readStarBtn').innerHTML=`<i class="bi ${m.isStarred?'bi-star-fill':'bi-star'}"></i>`;
 $('readStarBtn').style.color=m.isStarred?'#f59e0b':'';
}
async function openMessage(id){
 const row=currentMessages.find(x=>x.mailId===id);if(!row)return;
 selectedMailId=id;selectedMessage=row;selectedAttachments=[];
 renderList();$('readEmpty').classList.add('hidden');$('readContent').classList.remove('hidden');$('readPane').classList.add('mobile-show');
 paintReadHeader(row);
 $('readBody').innerHTML='<div class="loading-inline"><span class="panel-spinner" aria-label="Loading"></span></div>';$('attachmentList').innerHTML='';
 if(row.isRead===false||!row.isRead){row.isRead=true;renderList();}
 try{const result=await MailboxAPI.get(id);if(selectedMailId!==id)return;selectedMessage=result.message||row;selectedAttachments=result.attachments||[];renderMessage(result)}catch(err){$('readBody').textContent=err.message||'Unable to load message.'}
}
function renderMessage(result){const m=result.message||{};paintReadHeader(m);const row=currentMessages.find(x=>x.mailId===selectedMailId);if(row)row.isRead=true;const body=$('readBody');if(String(m.bodyType||'').toUpperCase()==='HTML'){body.innerHTML=m.body||''}else{body.textContent=m.body||''}renderAttachments(result.attachments||[]);selectedMessage=m;selectedAttachments=result.attachments||[];renderList()}
function renderAttachments(items){const c=$('attachmentList');c.innerHTML=(Array.isArray(items)?items:[]).map(a=>`<a class="attachment" href="${escAttr(a.url||'#')}" target="_blank" rel="noopener noreferrer"><span><i class="bi bi-paperclip"></i></span><span title="${escAttr(a.fileName)}">${esc(a.fileName||'Attachment')}</span><small>${esc(formatSize(a.size))}</small></a>`).join('')}

function closeRead(){selectedMailId='';selectedMessage=null;selectedAttachments=[];$('readContent').classList.add('hidden');$('readEmpty').classList.remove('hidden');$('readPane').classList.remove('mobile-show');renderList()}
async function readAction(changes){if(!selectedMailId)return;try{await MailboxAPI.update(Object.assign({mailId:selectedMailId},changes));invalidateFolderCache();await load(currentPage,{silent:true});if(changes.Folder||changes.Is_Deleted){closeRead()}else{await openMessage(selectedMailId)}}catch(err){alert(err.message||'Unable to update message.')}}

function openCompose(mode='new',message=null,attachments=[]){composeMode=mode;originalMessage=message;originalAttachments=attachments||[];attachmentFiles=[];hideComposeAlert();$('composeLoading').classList.add('hidden');$('composeStatus').textContent='';$('fileList').innerHTML='';$('mailTo').value='';$('mailCc').value='';$('mailBcc').value='';$('mailSubject').value='';$('mailBody').value='';$('mailFiles').value='';$('modeBadge').classList.toggle('hidden',mode==='new');$('modeBadge').textContent=mode==='reply'?'Reply':'Forward';$('composeTitle').textContent=mode==='reply'?'Reply message':mode==='forward'?'Forward message':'New message';if(mode==='reply'&&message){$('mailTo').value=message.senderEmail||'';$('mailSubject').value=replySubject(message.subject);$('mailBody').value='\n\n'}if(mode==='forward'&&message){$('mailSubject').value=forwardSubject(message.subject);$('mailBody').value=createForwarded(message)}$('composeModal').classList.add('show');$('composeModal').setAttribute('aria-hidden','false');$('mailTo').focus();if(mode==='forward'&&originalAttachments.length)prepareForwardAttachments(originalAttachments)}
function replySubject(s){return /^re:/i.test(String(s||''))?String(s):'Re: '+String(s||'(No subject)')}
function forwardSubject(s){return /^fwd:/i.test(String(s||''))?String(s):'Fwd: '+String(s||'(No subject)')}
function createForwarded(m){return `\n\n---------- Forwarded message ----------\nFrom: ${m.senderName||''} <${m.senderEmail||''}>\nDate: ${m.date||''}\nSubject: ${m.subject||'(No subject)'}\nTo: ${m.to||''}${m.cc?'\nCc: '+m.cc:''}\n\n${String(m.body||'')}`}
function closeCompose(){if(sending)return;$('composeModal').classList.remove('show');$('composeModal').setAttribute('aria-hidden','true')}

async function prepareForwardAttachments(items){$('composeStatus').textContent='Preparing original attachments…';for(const item of items){try{const file=await attachmentToFile(item);attachmentFiles.push(file);renderFiles()}catch(e){console.warn('Forward attachment failed',e)}}$('composeStatus').textContent=attachmentFiles.length?`${attachmentFiles.length} original attachment(s) prepared.`:'Original attachments could not be copied automatically.'}
async function attachmentToFile(item){if(item.base64||item.data){const b=atob(item.base64||item.data),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new File([u],item.fileName||item.name||'attachment',{type:item.mimeType||item.type||'application/octet-stream'})}const url=item.url||item.downloadUrl||item.fileUrl;if(!url)throw new Error('Attachment URL is missing.');const r=await fetch(url,{credentials:'omit'});if(!r.ok)throw new Error('Unable to download attachment.');const blob=await r.blob();return new File([blob],item.fileName||item.name||'attachment',{type:item.mimeType||blob.type||'application/octet-stream'})}
function renderFiles(){const c=$('fileList');c.innerHTML=attachmentFiles.map((f,i)=>`<div class="file-chip"><span><i class="bi bi-paperclip"></i> ${esc(f.name)} · ${esc(formatSize(f.size))}</span><button type="button" data-remove-file="${i}">×</button></div>`).join('');document.querySelectorAll('[data-remove-file]').forEach(b=>b.addEventListener('click',()=>{attachmentFiles.splice(Number(b.dataset.removeFile),1);renderFiles()}))}
function readFiles(){return Promise.all(attachmentFiles.map(file=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve({name:file.name,size:file.size,mimeType:file.type,base64:String(r.result||'').split(',')[1]||''});r.onerror=reject;r.readAsDataURL(file)})))}
function setSendingState(state){sending=state;document.querySelectorAll('#composeModal input,#composeModal textarea,#composeModal button').forEach(el=>el.disabled=state);$('sendBtn').classList.toggle('loading',state);$('sendBtn').disabled=state;$('sendBtn').querySelector('.send-label').textContent='Send'}

async function sendMessage(){if(sending)return;hideComposeAlert();const to=$('mailTo').value.trim();if(!to){alertCompose('Please enter at least one recipient.','warning');$('mailTo').focus();return}if(!$('mailSubject').value.trim()&&!confirm('The subject is empty. Send anyway?'))return;try{setSendingState(true);$('composeStatus').textContent='Preparing message…';const attachments=await readFiles();$('composeStatus').textContent='Sending message…';const result=await MailboxAPI.send({to,cc:$('mailCc').value,bcc:$('mailBcc').value,subject:$('mailSubject').value,body:$('mailBody').value,bodyType:'TEXT',attachments});setSendingState(false);closeCompose();$('successReference').textContent='Reference: '+(result.referenceNo||'—');$('successModal').classList.add('show');invalidateFolderCache('SENT');invalidateFolderCache('INBOX');await load(1)}catch(err){setSendingState(false);alertCompose(err.message||'Unable to send message.','error');$('composeStatus').textContent=''}}
async function saveDraft(){if(sending)return;try{setSendingState(true);const result=await MailboxAPI.draft({to:$('mailTo').value,cc:$('mailCc').value,bcc:$('mailBcc').value,subject:$('mailSubject').value,body:$('mailBody').value,bodyType:'TEXT'});setSendingState(false);$('composeStatus').textContent='Draft saved'+(result.referenceNo?' · '+result.referenceNo:'');invalidateFolderCache('DRAFT');await load(1)}catch(err){setSendingState(false);alertCompose(err.message||'Unable to save draft.')}}

let suggestTimer=null,suggestSeq=0;
function hideSuggestions(){$('suggestions').classList.remove('show');$('suggestions').innerHTML=''}
function renderSuggestions(items){const c=$('suggestions');if(!items.length){hideSuggestions();return}c.innerHTML=items.map((x,i)=>`<div class="suggestion" data-suggest-index="${i}"><div class="suggestion-name">${esc(x.name||x.email)}</div><div class="suggestion-email">${esc(x.email)}${x.department?' · '+esc(x.department):''}</div></div>`).join('');c.classList.add('show');document.querySelectorAll('[data-suggest-index]').forEach(el=>el.addEventListener('mousedown',e=>{e.preventDefault();const x=items[Number(el.dataset.suggestIndex)];$('mailTo').value=x.email;hideSuggestions()}))}
$('mailTo').addEventListener('input',()=>{clearTimeout(suggestTimer);const q=$('mailTo').value.split(',').pop().trim();if(!q){hideSuggestions();return}const seq=++suggestSeq;suggestTimer=setTimeout(async()=>{try{const r=await MailboxAPI.suggestRecipients(q);if(seq===suggestSeq)renderSuggestions(r.items||[])}catch(_){hideSuggestions()}},180)});
$('mailTo').addEventListener('blur',()=>setTimeout(hideSuggestions,180));

$('composeBtn').addEventListener('click',()=>openCompose('new'));
$('closeCompose').addEventListener('click',closeCompose);$('discardBtn').addEventListener('click',()=>{if(confirm('Discard this message?'))closeCompose()});$('sendBtn').addEventListener('click',sendMessage);$('draftBtn').addEventListener('click',saveDraft);$('attachBtn').addEventListener('click',()=>!sending&&$('mailFiles').click());
$('mailFiles').addEventListener('change',e=>{if(sending)return;for(const f of [...e.target.files])attachmentFiles.push(f);renderFiles();$('composeStatus').textContent=`${attachmentFiles.length} attachment(s) selected.`;e.target.value=''});
$('successOk').addEventListener('click',()=>{$('successModal').classList.remove('show');});
$('composeModal').addEventListener('click',e=>{if(e.target===$('composeModal'))closeCompose()});

$('replyBtn').addEventListener('click',()=>{if(selectedMessage)openCompose('reply',selectedMessage,selectedAttachments)});
$('forwardBtn').addEventListener('click',()=>{if(selectedMessage)openCompose('forward',selectedMessage,selectedAttachments)});
$('readArchiveBtn').addEventListener('click',()=>readAction({Folder:'ARCHIVE',Is_Archived:'YES',Is_Deleted:'NO',Is_Spam:'NO'}));
$('readDeleteBtn').addEventListener('click',()=>{if(confirm('Move this message to Trash?'))readAction({Folder:'TRASH',Is_Deleted:'YES'})});
$('readStarBtn').addEventListener('click',async()=>{if(!selectedMailId)return;try{await readAction({Is_Starred:selectedMessage&&selectedMessage.isStarred?'NO':'YES'})}catch(e){alert(e.message)}});
$('backBtn').addEventListener('click',closeRead);

const prefetchTimers=new Map();
const prefetchPromises=new Map();
function prefetchFolder(folder){
 const key=cacheKey(folder,1);
 if(folderCache.has(key)||prefetchPromises.has(key)||folder===currentFolder)return;
 const promise=MailboxAPI.list(folder,'',1,pageSize).then(data=>{folderCache.set(key,{data,time:Date.now()});return data}).catch(()=>null).finally(()=>prefetchPromises.delete(key));
 prefetchPromises.set(key,promise);
}
document.querySelectorAll('.folder').forEach(b=>{
 b.addEventListener('mouseenter',()=>{
  const folder=b.dataset.folder;
  clearTimeout(prefetchTimers.get(folder));
  prefetchTimers.set(folder,setTimeout(()=>prefetchFolder(folder),180));
 });
 b.addEventListener('mouseleave',()=>clearTimeout(prefetchTimers.get(b.dataset.folder)));
 b.addEventListener('click',()=>{
if(currentFolder===b.dataset.folder)return;
 folderViews.set(currentFolder,{html:$('mailList').innerHTML,scrollTop:$('mailList').scrollTop,messages:currentMessages,page:currentPage,totalPages:totalPages});
 currentFolder=b.dataset.folder;currentPage=1;selectedMailId='';selectedMessage=null;selectedAttachments=[];saveFolder();updateFolderUI();closeRead();
 const view=folderViews.get(currentFolder);const c=folderCache.get(cacheKey(currentFolder,1));
 if(view&&view.messages){currentMessages=view.messages;currentPage=view.page||1;totalPages=view.totalPages||1;renderList();updatePager({total:currentMessages.length,page:currentPage,totalPages:totalPages,hasPrevious:currentPage>1,hasNext:currentPage<totalPages});requestAnimationFrame(()=>{$('mailList').scrollTop=view.scrollTop||0});}
 else if(c)applyMailboxData(c.data);
 load(1,{silent:true});});
});
$('prevPage').addEventListener('click',()=>load(Math.max(1,currentPage-1)));$('nextPage').addEventListener('click',()=>load(Math.min(totalPages,currentPage+1)));$('pageSize').addEventListener('change',()=>{pageSize=Number($('pageSize').value)||25;load(1)});
$('selectAllBtn').addEventListener('click',()=>{const all=currentMessages.length&&selectedIds.size===currentMessages.length;if(all)selectedIds.clear();else currentMessages.forEach(m=>selectedIds.add(m.mailId));renderList();updateToolbar()});
$('markReadBtn').addEventListener('click',()=>applySelected({Is_Read:'YES'}));$('markUnreadBtn').addEventListener('click',()=>applySelected({Is_Read:'NO'}));$('archiveBtn').addEventListener('click',()=>applySelected({Folder:'ARCHIVE',Is_Archived:'YES'}));$('spamBtn').addEventListener('click',()=>applySelected({Folder:'SPAM',Is_Spam:'YES'}));$('deleteBtn').addEventListener('click',()=>applySelected({Folder:'TRASH',Is_Deleted:'YES'}));
$('refreshBtn').addEventListener('click',()=>load(currentPage));$('refreshListBtn').addEventListener('click',()=>load(currentPage));
function runSearch(){clearTimeout(searchTimer);searchTimer=setTimeout(()=>load(1),260);$('clearSearch').style.display=$('searchInput').value?'block':'none'}
$('searchInput').addEventListener('input',runSearch);$('searchInput').addEventListener('keydown',e=>{if(e.key==='Escape'){$('searchInput').value='';runSearch()}});$('clearSearch').addEventListener('click',()=>{$('searchInput').value='';runSearch();$('searchInput').focus()});
$('logoutBtn').addEventListener('click',async()=>{try{await MailboxAPI.logout()}catch(_){}MailboxAPI.clearSession();location.href='login.html'});

document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('successModal').classList.contains('show'))$('successModal').classList.remove('show');else if($('composeModal').classList.contains('show'))closeCompose();else if($('readPane').classList.contains('mobile-show'))closeRead()}});

document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(currentPage,{silent:true})});
async function silentRefresh(){if(document.hidden){silentTimer=setTimeout(silentRefresh,45000);return}try{const key=cacheKey(currentFolder,currentPage);const data=await MailboxAPI.list(currentFolder,$('searchInput').value.trim(),currentPage,pageSize);folderCache.set(key,{data,time:Date.now()});const sig=signature(data.messages||[]);if(sig!==signature(currentMessages)){currentMessages=data.messages||[];currentPage=data.page||currentPage;totalPages=data.totalPages||1;renderList();updatePager(data)}}catch(_){}finally{silentTimer=setTimeout(silentRefresh,45000)}}
function startSilent(){clearTimeout(silentTimer);silentTimer=setTimeout(silentRefresh,45000)}

function initSplitter(){
 const handle=$('paneSplitter'),main=document.querySelector('.main'),mailArea=document.querySelector('.mail-area');
 if(!handle||!main||!mailArea)return;
 const saved=parseInt(localStorage.getItem('mailbox_list_width')||'',10);
 const applyWidth=w=>{const min=320,max=Math.min(main.getBoundingClientRect().width*.75,900);const width=Math.max(min,Math.min(max,w));mailArea.style.width=width+'px';mailArea.style.flexBasis=width+'px';};
 if(saved>=320)applyWidth(saved);
 const move=e=>{if(!splitterDragging)return;const rect=main.getBoundingClientRect();const side=document.querySelector('.sidebar').getBoundingClientRect();applyWidth(e.clientX-side.right);e.preventDefault()};
 const stop=()=>{if(!splitterDragging)return;splitterDragging=false;handle.classList.remove('dragging');document.body.style.cursor='';document.body.style.userSelect='';localStorage.setItem('mailbox_list_width',Math.round(mailArea.getBoundingClientRect().width));window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',stop);};
 handle.addEventListener('pointerdown',e=>{if(window.matchMedia('(max-width:760px)').matches)return;splitterDragging=true;handle.classList.add('dragging');document.body.style.cursor='col-resize';document.body.style.userSelect='none';window.addEventListener('pointermove',move,{passive:false});window.addEventListener('pointerup',stop,{once:false});e.preventDefault();});
}
window.addEventListener('resize',()=>{if(window.matchMedia('(max-width:760px)').matches){document.querySelector('.mail-area').style.width=''}else{const w=parseInt(localStorage.getItem('mailbox_list_width')||'',10);if(w)document.querySelector('.mail-area').style.width=w+'px';document.querySelector('.mail-area').style.flexBasis=w+'px'}});

initSplitter();
updateFolderUI();
load(1).finally(()=>startSilent());
})();
</script>
</body>
</html>
