  <!--begin::Theme Init-->
  <script>
    (() => {
      'use strict';

      const root = document.documentElement;

      if (root.getAttribute('data-lte-color-mode') === 'off') {
        return;
      }

      const STORAGE_KEY = 'lte-theme';
      let stored = null;

      try {
        stored = localStorage.getItem(STORAGE_KEY);
      } catch (_) {}

      const authored = root.getAttribute('data-bs-theme');

      let resolved = 'light';

      if (stored === 'dark' || stored === 'light') {
        resolved = stored;
      } else if (authored === 'dark' || authored === 'light') {
        resolved = authored;
      } else if (
        globalThis.matchMedia &&
        globalThis.matchMedia('(prefers-color-scheme: dark)').matches
      ) {
        resolved = 'dark';
      }

      root.setAttribute('data-bs-theme', resolved);
      root.style.colorScheme = resolved;

      if (resolved !== authored) {
        root.setAttribute('data-lte-theme-resolved', '');
      }
    })();
  </script>

<script>
(() => {

  'use strict';


  /* =========================================================
     LOGIN
     ========================================================= */

  MailboxAPI.requireLogin();


  /* =========================================================
     DOM
     ========================================================= */

  const messageList =
    document.getElementById('message-list');

  const messageRange =
    document.getElementById('message-range');

  const selectAll =
    document.getElementById('select-all');

  const refreshButton =
    document.getElementById('refresh-button');

  const folderTitle =
    document.getElementById('folder-title');

  const folderTitleIcon =
    document.getElementById('folder-title-icon');

  const pageHeading =
    document.getElementById('page-heading');

  const breadcrumbFolder =
    document.getElementById('breadcrumb-folder');

  const labelList =
    document.getElementById('label-list');

  const logoutButton =
    document.getElementById('logout-button');


  /* =========================================================
     FOLDER DEFINITIONS
     ========================================================= */

  const folders = {

    INBOX: {
      label: 'Inbox',
      icon: 'bi-inbox'
    },

    SENT: {
      label: 'Sent',
      icon: 'bi-send'
    },

    DRAFT: {
      label: 'Drafts',
      icon: 'bi-file-earmark'
    },

    STARRED: {
      label: 'Starred',
      icon: 'bi-star'
    },

    ARCHIVE: {
      label: 'Archive',
      icon: 'bi-archive'
    },

    SPAM: {
      label: 'Spam',
      icon: 'bi-exclamation-octagon'
    },

    TRASH: {
      label: 'Trash',
      icon: 'bi-trash'
    }

  };


  /* =========================================================
     STATE
     ========================================================= */

  let currentFolder = 'INBOX';

  let currentMessages = [];

  let currentLabel = '';

  let isLoading = false;


  /* =========================================================
     STORAGE
     ========================================================= */

  const STORAGE_KEY =
    'mailbox-selected-folder';


  function saveFolder(folder) {

    try {
      sessionStorage.setItem(
        STORAGE_KEY,
        folder
      );
    } catch (_) {}

  }


  function getSavedFolder() {

    try {

      const folder =
        sessionStorage.getItem(STORAGE_KEY);

      if (folder && folders[folder]) {
        return folder;
      }

    } catch (_) {}

    return 'INBOX';

  }


  /* =========================================================
     ESCAPE HTML
     ========================================================= */

  function esc(value) {

    return String(value ?? '')
      .replace(
        /[&<>"']/g,
        character => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[character])
      );

  }


  /* =========================================================
     DATE
     ========================================================= */

  function dateLabel(value) {

    const text =
      String(value || '');

    return (
      text.split(' ')[0] ||
      text
    );

  }


  /* =========================================================
     BODY PREVIEW
     ========================================================= */

  function bodyPreview(value) {

    return String(value || '')
      .replace(/<[^>]*>/g, ' ')
      .replace(/\s+/g, ' ')
      .trim()
      .slice(0, 110);

  }


  /* =========================================================
     LOADING STATE
     ========================================================= */

  function showLoading() {

    isLoading = true;

    messageList.innerHTML = `

      <li class="list-group-item p-0">

        <div class="mail-loading">

          <div
            class="spinner-border text-primary"
            role="status"
            aria-hidden="true"
          ></div>

          <div class="text-secondary">
            Loading ${esc(
              folders[currentFolder]?.label || 'messages'
            )}…
          </div>

        </div>

      </li>

    `;

    messageRange.textContent =
      'Loading…';

    selectAll.checked = false;
    selectAll.disabled = true;

  }


  /* =========================================================
     EMPTY STATE
     ========================================================= */

  function showEmpty(message = 'No messages found.') {

    messageList.innerHTML = `

      <li class="list-group-item p-0">

        <div class="mail-empty">

          <i
            class="bi bi-envelope-open text-secondary"
            aria-hidden="true"
          ></i>

          <div class="text-secondary">
            ${esc(message)}
          </div>

        </div>

      </li>

    `;

    messageRange.textContent =
      '0 of 0';

    selectAll.checked = false;
    selectAll.disabled = true;

  }


  /* =========================================================
     ERROR STATE
     ========================================================= */

  function showError(error) {

    const message =
      error?.message ||
      'Unable to load messages.';

    messageList.innerHTML = `

      <li class="list-group-item p-0">

        <div class="mail-error">

          <i
            class="bi bi-exclamation-triangle text-danger"
            style="font-size:2rem;"
            aria-hidden="true"
          ></i>

          <div class="fw-semibold">
            Unable to load messages
          </div>

          <div class="text-secondary small">
            ${esc(message)}
          </div>

          <button
            type="button"
            class="btn btn-sm btn-primary"
            id="retry-load-button"
          >
            <i class="bi bi-arrow-clockwise me-1"></i>
            Retry
          </button>

        </div>

      </li>

    `;

    messageRange.textContent =
      'Error';

    selectAll.checked = false;
    selectAll.disabled = true;

    document
      .getElementById('retry-load-button')
      ?.addEventListener(
        'click',
        load
      );

  }


  /* =========================================================
     UPDATE FOLDER HEADER
     ========================================================= */

  function updateFolderHeader() {

    const folder =
      folders[currentFolder] ||
      folders.INBOX;

    pageHeading.textContent =
      folder.label;

    breadcrumbFolder.textContent =
      folder.label;

    folderTitle.querySelector('span')?.remove();

    const titleText =
      document.createElement('span');

    titleText.textContent =
      folder.label;

    folderTitle.appendChild(titleText);


    folderTitleIcon.className =
      `bi ${folder.icon} folder-title-icon`;

  }


  /* =========================================================
     SELECTED FOLDER
     ========================================================= */

  function updateFolderSelection() {

    document
      .querySelectorAll('.mail-folder-link')
      .forEach(link => {

        const isSelected =
          link.dataset.folder === currentFolder;

        link.classList.toggle(
          'active',
          isSelected
        );

        link.setAttribute(
          'aria-current',
          isSelected
            ? 'page'
            : 'false'
        );

      });

  }


  /* =========================================================
     LABEL EXTRACTION
     ========================================================= */

  function getLabels(messages) {

    const labels =
      new Map();

    messages.forEach(message => {

      const value =
        String(message?.label || '')
          .trim();

      if (!value) {
        return;
      }

      value
        .split(',')
        .map(x => x.trim())
        .filter(Boolean)
        .forEach(label => {

          if (!labels.has(label)) {
            labels.set(
              label,
              labels.size
            );
          }

        });

    });

    return [...labels.keys()];

  }


  /* =========================================================
     RENDER LABELS
     ========================================================= */

  function renderLabels(messages) {

    const labels =
      getLabels(messages);

    labelList.innerHTML = '';


    /* All messages */

    const allItem =
      document.createElement('li');

    allItem.className =
      'nav-item';

    allItem.innerHTML = `

      <a
        href="#"
        class="nav-link mail-label-link ${currentLabel === '' ? 'active' : ''}"
        data-label=""
      >

        <i
          class="bi bi-tags me-2"
          aria-hidden="true"
        ></i>

        All labels

      </a>

    `;

    labelList.appendChild(
      allItem
    );


    if (!labels.length) {

      const empty =
        document.createElement('li');

      empty.className =
        'label-empty';

      empty.textContent =
        'No labels found';

      labelList.appendChild(
        empty
      );

    } else {

      labels.forEach(label => {

        const item =
          document.createElement('li');

        item.className =
          'nav-item';

        item.innerHTML = `

          <a
            href="#"
            class="nav-link mail-label-link ${currentLabel === label ? 'active' : ''}"
            data-label="${esc(label)}"
          >

            <i
              class="bi bi-circle-fill text-primary me-2"
              style="font-size:.6rem"
              aria-hidden="true"
            ></i>

            ${esc(label)}

          </a>

        `;

        labelList.appendChild(
          item
        );

      });

    }


    labelList
      .querySelectorAll('.mail-label-link')
      .forEach(link => {

        link.addEventListener(
          'click',
          event => {

            event.preventDefault();

            currentLabel =
              link.dataset.label || '';

            renderMessages(
              currentMessages
            );

            renderLabels(
              currentMessages
            );

          }
        );

      });

  }


  /* =========================================================
     FILTER BY LABEL
     ========================================================= */

  function filteredMessages(messages) {

    if (!currentLabel) {
      return messages;
    }

    return messages.filter(message => {

      const labels =
        String(message?.label || '')
          .split(',')
          .map(x => x.trim())
          .filter(Boolean);

      return labels.some(
        label =>
          label.toLowerCase() ===
          currentLabel.toLowerCase()
      );

    });

  }


  /* =========================================================
     RENDER MESSAGES
     ========================================================= */

  function renderMessages(messages) {

    const filtered =
      filteredMessages(messages);

    messageList.innerHTML = '';

    isLoading = false;


    if (!filtered.length) {

      if (currentLabel) {

        showEmpty(
          `No messages with label "${currentLabel}".`
        );

      } else {

        showEmpty(
          'No messages found.'
        );

      }

      return;

    }


    filtered.forEach(
      (message, index) => {

        const li =
          document.createElement('li');

        li.className =
          'list-group-item d-flex align-items-center gap-2 message-row' +
          (
            message.isRead
              ? ''
              : ' unread'
          );


        const mailId =
          message.mailId || '';


        const subject =
          message.subject ||
          '(No subject)';


        const sender =
          message.senderName ||
          message.senderEmail ||
          '(Unknown sender)';


        const preview =
          bodyPreview(
            message.body
          );


        const date =
          dateLabel(
            message.date
          );


        const isStarred =
          message.isStarred === true ||
          String(message.isStarred || '')
            .toUpperCase() === 'YES';


        const label =
          String(
            message.label || ''
          ).trim();


        li.innerHTML = `

          <div class="form-check mb-0">

            <input
              class="form-check-input msg-check"
              type="checkbox"
              data-id="${esc(mailId)}"
              id="msg-${index}"
            >

            <label
              class="form-check-label visually-hidden"
              for="msg-${index}"
            >
              Select ${esc(subject)}
            </label>

          </div>


          <button
            class="btn btn-link p-0 lh-1 star-btn ${
              isStarred
                ? 'text-warning'
                : 'text-secondary'
            }"
            type="button"
            title="${
              isStarred
                ? 'Unstar'
                : 'Star'
            }"
            aria-label="${
              isStarred
                ? 'Unstar'
                : 'Star'
            }"
            data-id="${esc(mailId)}"
          >

            <i
              class="bi ${
                isStarred
                  ? 'bi-star-fill'
                  : 'bi-star'
              }"
              aria-hidden="true"
            ></i>

          </button>


          <a
            href="read.html?id=${encodeURIComponent(mailId)}"
            class="flex-grow-1 d-flex flex-column flex-md-row gap-md-3 text-decoration-none text-body"
            style="min-width:0"
          >

            <span
              class="text-truncate"
              style="min-width:9rem"
              title="${esc(sender)}"
            >
              ${esc(sender)}
            </span>


            <span
              class="flex-grow-1 text-truncate"
              style="min-width:0"
            >

              ${
                label
                  ? `
                    <span
                      class="badge text-bg-primary me-2"
                    >
                      ${esc(label)}
                    </span>
                  `
                  : ''
              }

              ${esc(subject)}

              ${
                preview
                  ? `
                    <span
                      class="fw-normal text-secondary"
                    >
                      &nbsp;&mdash;
                      ${esc(preview)}
                    </span>
                  `
                  : ''
              }

            </span>


            <span
              class="text-secondary small text-md-end"
              style="min-width:5rem"
            >
              ${esc(date)}
            </span>

          </a>

        `;


        messageList.appendChild(
          li
        );

      }
    );


    messageRange.textContent =
      `1–${filtered.length} of ${filtered.length}`;


    selectAll.disabled = false;
    selectAll.checked = false;


    /* =======================================================
       STAR BUTTONS
       ======================================================= */

    messageList
      .querySelectorAll('.star-btn')
      .forEach(button => {

        button.addEventListener(
          'click',
          async event => {

            event.preventDefault();
            event.stopPropagation();

            const icon =
              button.querySelector('i');

            const currentlyStarred =
              icon.classList.contains(
                'bi-star-fill'
              );


            button.disabled = true;

            try {

              await MailboxAPI.update({

                mailId:
                  button.dataset.id,

                Is_Starred:
                  currentlyStarred
                    ? 'NO'
                    : 'YES'

              });

              await load();

            } catch (error) {

              showError(
                error
              );

            } finally {

              button.disabled = false;

            }

          }
        );

      });

  }


  /* =========================================================
     LOAD MESSAGES
     ========================================================= */

  async function load() {

    if (isLoading) {
      return;
    }

    showLoading();


    try {

      const data =
        await MailboxAPI.list(
          currentFolder,
          ''
        );


      currentMessages =
        Array.isArray(data?.messages)
          ? data.messages
          : [];


      renderMessages(
        currentMessages
      );


      renderLabels(
        currentMessages
      );


    } catch (error) {

      isLoading = false;

      if (
        /session/i.test(
          error?.message || ''
        )
      ) {

        MailboxAPI.clearSession();

        window.location.href =
          'login.html';

        return;

      }

      showError(
        error
      );

    }

  }


  /* =========================================================
     FOLDER CLICK
     ========================================================= */

  document
    .querySelectorAll('.mail-folder-link')
    .forEach(link => {

      link.addEventListener(
        'click',
        async event => {

          event.preventDefault();


          const folder =
            link.dataset.folder;


          if (!folders[folder]) {
            return;
          }


          if (
            folder === currentFolder &&
            !isLoading
          ) {

            return;

          }


          currentFolder =
            folder;


          currentLabel =
            '';


          saveFolder(
            currentFolder
          );


          updateFolderSelection();

          updateFolderHeader();

          renderLabels([]);


          await load();

        }
      );

    });


  /* =========================================================
     SEARCH
     ========================================================= */

  const search =
    document.querySelector(
      'input[placeholder^="Search mail"]'
    );


  if (search) {

    let searchTimer;


    search.addEventListener(
      'input',
      () => {

        clearTimeout(
          searchTimer
        );


        searchTimer =
          setTimeout(
            async () => {

              showLoading();


              try {

                const data =
                  await MailboxAPI.list(
                    currentFolder,
                    search.value || ''
                  );


                currentMessages =
                  Array.isArray(
                    data?.messages
                  )
                    ? data.messages
                    : [];


                renderMessages(
                  currentMessages
                );


                renderLabels(
                  currentMessages
                );


              } catch (error) {

                showError(
                  error
                );

              }

            },
            250
          );

      }
    );

  }


  /* =========================================================
     REFRESH
     ========================================================= */

  refreshButton?.addEventListener(
    'click',
    async () => {

      refreshButton.disabled =
        true;

      try {

        await load();

      } finally {

        refreshButton.disabled =
          false;

      }

    }
  );


  /* =========================================================
     SELECT ALL
     ========================================================= */

  selectAll?.addEventListener(
    'change',
    () => {

      messageList
        .querySelectorAll(
          '.msg-check'
        )
        .forEach(
          checkbox => {
            checkbox.checked =
              selectAll.checked;
          }
        );

    }
  );


  /* =========================================================
     LOGOUT
     Same implementation used in read.html
     ========================================================= */

  logoutButton?.addEventListener(
    'click',
    async () => {

      const button =
        document.getElementById(
          'logout-button'
        );


      if (button) {
        button.disabled = true;
      }


      try {

        await MailboxAPI.logout();

      } catch (_) {}


      MailboxAPI.clearSession();


      window.location.href =
        'login.html';

    }
  );


  /* =========================================================
     USER INFORMATION
     ========================================================= */

  const user =
    MailboxAPI.user();


  if (user) {

    document
      .querySelectorAll(
        '[data-mailbox-user-name]'
      )
      .forEach(
        element => {
          element.textContent =
            user.name;
        }
      );

  }


  /* =========================================================
     INITIALISE
     ========================================================= */

  currentFolder =
    getSavedFolder();


  updateFolderSelection();

  updateFolderHeader();

  renderLabels([]);


  load();


})();
</script>


<!-- ===========================================================
     COLOR MODE / APEX SUPPORT
     =========================================================== -->
<script>
(() => {

  'use strict';


  const mode = () =>
    document.documentElement
      .getAttribute('data-bs-theme') === 'dark'
      ? 'dark'
      : 'light';


  globalThis.Apex ||= {};

  const apex =
    globalThis.Apex;


  apex.theme = {
    mode: mode()
  };


  apex.chart =
    Object.assign(
      apex.chart || {},
      {
        background: 'transparent'
      }
    );


  new MutationObserver(
    () => {

      const next =
        mode();


      apex.theme = {
        mode: next
      };


      const instances =
        apex._chartInstances || [];


      for (
        const { chart } of instances
      ) {

        try {

          chart.updateOptions(
            {
              theme: {
                mode: next
              }
            },
            false,
            false
          );

        } catch (_) {}

      }

    }
  ).observe(
    document.documentElement,
    {
      attributes: true,
      attributeFilter: [
        'data-bs-theme'
      ]
    }
  );

})();
</script>

</body>
</html>
