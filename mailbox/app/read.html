  <script>
    (() => {
      'use strict';
      const root = document.documentElement;
      if (root.getAttribute('data-lte-color-mode') === 'off') return;

      const STORAGE_KEY = 'lte-theme';
      let stored = null;
      try { stored = localStorage.getItem(STORAGE_KEY); } catch {}
      const authored = root.getAttribute('data-bs-theme');
      let resolved = 'light';
      if (stored === 'dark' || stored === 'light') resolved = stored;
      else if (authored === 'dark' || authored === 'light') resolved = authored;
      else if (globalThis.matchMedia('(prefers-color-scheme: dark)').matches) resolved = 'dark';

      root.setAttribute('data-bs-theme', resolved);
      root.style.colorScheme = resolved;
      if (resolved !== authored) root.setAttribute('data-lte-theme-resolved', '');
    })();
  </script>

<script>
  const SELECTOR_SIDEBAR_WRAPPER = '.sidebar-wrapper';
  const Default = {
    scrollbarTheme: 'os-theme-light',
    scrollbarAutoHide: 'leave',
    scrollbarClickScroll: true,
  };

  document.addEventListener('DOMContentLoaded', function () {
    const sidebarWrapper = document.querySelector(SELECTOR_SIDEBAR_WRAPPER);
    const isMobile = window.innerWidth <= 992;

    if (
      sidebarWrapper &&
      globalThis.OverlayScrollbarsGlobal?.OverlayScrollbars !== undefined &&
      !isMobile
    ) {
      globalThis.OverlayScrollbarsGlobal.OverlayScrollbars(sidebarWrapper, {
        scrollbars: {
          theme: Default.scrollbarTheme,
          autoHide: Default.scrollbarAutoHide,
          clickScroll: Default.scrollbarClickScroll,
        },
      });
    }
  });
</script>

<script>
(async () => {
  'use strict';

  MailboxAPI.requireLogin();

  const params = new URLSearchParams(window.location.search);
  const mailId = params.get('id');

  const $ = id => document.getElementById(id);

  $('logout-button')?.addEventListener('click', async () => {
    const button = $('logout-button');
    if (button) button.disabled = true;
    try { await MailboxAPI.logout(); } catch (_) {}
    MailboxAPI.clearSession();
    window.location.href = 'login.html';
  });

  function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, ch => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#039;'
    }[ch]));
  }

  function escapeAttr(value) { return escapeHtml(value); }

  function showAlert(message, type = 'danger') {
    const box = $('alert');
    box.textContent = message;
    box.className = `alert alert-${type}`;
  }

  function initials(name, email) {
    const source = String(name || email || '?').trim();
    const parts = source.split(/\s+/).filter(Boolean);
    if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
    return source.substring(0, 2).toUpperCase();
  }

  function formatSize(bytes) {
    const n = Number(bytes || 0);
    if (!n) return '';
    if (n < 1024) return `${n} B`;
    if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
    if (n < 1024 * 1024 * 1024) return `${(n / 1024 / 1024).toFixed(1)} MB`;
    return `${(n / 1024 / 1024 / 1024).toFixed(1)} GB`;
  }

  function attachmentIcon(mimeType, fileName) {
    const mime = String(mimeType || '').toLowerCase();
    const name = String(fileName || '').toLowerCase();

    if (mime.includes('pdf') || name.endsWith('.pdf'))
      return 'bi-file-earmark-pdf-fill text-danger';
    if (mime.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(name))
      return 'bi-file-earmark-image-fill text-primary';
    if (mime.includes('word') || /\.(doc|docx)$/i.test(name))
      return 'bi-file-earmark-word-fill text-primary';
    if (mime.includes('excel') || /\.(xls|xlsx|csv)$/i.test(name))
      return 'bi-file-earmark-spreadsheet-fill text-success';
    if (mime.includes('zip') || /\.(zip|rar|7z)$/i.test(name))
      return 'bi-file-earmark-zip-fill text-warning';
    return 'bi-paperclip text-secondary';
  }

  function renderAttachments(items) {
    const section = $('attachments-section');
    const container = $('attachments');

    if (!Array.isArray(items) || !items.length) {
      section.classList.add('d-none');
      container.innerHTML = '';
      return;
    }

    section.classList.remove('d-none');

    container.innerHTML = items.map(item => {
      const icon = attachmentIcon(item.mimeType, item.fileName);
      const size = formatSize(item.size);

      return `
        <div class="col-md-6">
          <div class="card attachment-card">
            <div class="card-body py-2 px-3 d-flex align-items-center gap-2">
              <i class="bi ${icon} fs-3 attachment-icon" aria-hidden="true"></i>
              <div class="flex-grow-1 min-w-0">
                <p class="mb-0 small fw-semibold text-truncate"
                   title="${escapeHtml(item.fileName)}">
                  ${escapeHtml(item.fileName || 'Attachment')}
                </p>
                <small class="text-secondary">
                  ${escapeHtml(size || item.mimeType || '')}
                </small>
              </div>
              <a href="${escapeAttr(item.url || '#')}"
                 class="btn btn-sm btn-outline-secondary"
                 target="_blank"
                 rel="noopener noreferrer"
                 title="Open attachment"
                 aria-label="Open attachment">
                <i class="bi bi-download" aria-hidden="true"></i>
              </a>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  function renderMessage(result) {
    const m = result.message || {};

    document.title = `${m.subject || 'Message'} | MailBox - Read`;

    $('subject').textContent = m.subject || '(No subject)';
    $('sender-name').textContent = m.senderName || m.senderEmail || '';
    $('sender-email').textContent = m.senderEmail ? `<${m.senderEmail}>` : '';
    $('sender-avatar').textContent = initials(m.senderName, m.senderEmail);
    $('message-date').textContent = m.date || '';
    $('message-to').textContent = m.to || '';
    $('message-cc').textContent = m.cc || '';
    $('message-bcc').textContent = m.bcc || '';
    $('message-reference').textContent = m.referenceNo || '';

    $('cc-row').classList.toggle('d-none', !String(m.cc || '').trim());
    $('bcc-row').classList.toggle('d-none', !String(m.bcc || '').trim());

    const body = $('message-body');

    if (String(m.bodyType || '').toUpperCase() === 'HTML') {
      body.classList.add('message-html');
      body.innerHTML = m.body || '';
    } else {
      body.classList.remove('message-html');
      body.textContent = m.body || '';
    }

    renderAttachments(Array.isArray(result.attachments) ? result.attachments : []);
  }

  async function updateMessage(changes) {
    return MailboxAPI.update(Object.assign({ mailId }, changes));
  }

  $('reply-button').addEventListener('click', () => {
  if (!mailId) {
    showAlert('Message ID is missing.');
    return;
  }

  window.location.href =
    `compose.html?mode=reply&id=${encodeURIComponent(mailId)}`;
});


$('forward-button').addEventListener('click', () => {
  if (!mailId) {
    showAlert('Message ID is missing.');
    return;
  }

  window.location.href =
    `compose.html?mode=forward&id=${encodeURIComponent(mailId)}`;
});

  $('archive-button').addEventListener('click', async () => {
    const button = $('archive-button');
    button.disabled = true;

    try {
      await updateMessage({
        Folder: 'ARCHIVE',
        Is_Archived: 'YES',
        Is_Deleted: 'NO',
        Is_Spam: 'NO'
      });
      window.location.href = 'mailbox.html';
    } catch (err) {
      button.disabled = false;
      showAlert(err.message || 'Unable to archive message.');
    }
  });

  $('delete-button').addEventListener('click', async () => {
    const button = $('delete-button');

    if (!window.confirm('Move this message to Trash?')) return;

    button.disabled = true;

    try {
      await updateMessage({
        Folder: 'TRASH',
        Is_Deleted: 'YES'
      });
      window.location.href = 'mailbox.html';
    } catch (err) {
      button.disabled = false;
      showAlert(err.message || 'Unable to delete message.');
    }
  });

  $('previous-message').addEventListener('click', () => {
    window.history.back();
  });

  $('next-message').addEventListener('click', () => {
    window.history.forward();
  });

  try {
    if (!mailId) throw new Error('Message ID is missing.');

    const result = await MailboxAPI.get(mailId);
    renderMessage(result);
  } catch (err) {
    $('subject').textContent = 'Unable to load message';
    showAlert(err.message || 'Unable to load message.');
  }
})();
</script>
